<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA PrepX</title>
<meta name="description" content="Free study planner, ICAI RTP & MTP tracker and MCQ practice for CA Foundation, Intermediate and Final students.">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="CA PrepX">
<meta property="og:description" content="Plan it. Practise it. Tick it off. Study plans, RTP/MTP tracker and MCQs for CA students.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#FAF7EF; --surface:#FFFFFF; --surface-2:#F3EEE1; --ink:#141414; --muted:#6B6558;
  --line:#E6DFCC; --accent:#111111; --accent-ink:#E0B43A; --accent-soft:#F6EDD2;
  --gold:#E0B43A; --gold-deep:#9C7400; --gold-ink:#1A1405;
  --tick:#C2410C; --tick-soft:#FBE4D8; --good:#2F7D4F; --good-soft:#E2F1E7; --warn:#A86A00; --warn-soft:#F6EBCB;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0B0C; --surface:#161617; --surface-2:#1F1F22; --ink:#F3EEDF; --muted:#A39C88;
    --line:#2C2921; --accent:#E0B43A; --accent-ink:#1A1405; --accent-soft:#2A2414;
    --gold:#E0B43A; --gold-deep:#E0B43A; --gold-ink:#1A1405;
    --tick:#F2845C; --tick-soft:#3A2016; --good:#5FC08A; --good-soft:#15291E; --warn:#E3B04F; --warn-soft:#33290F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0C; --surface:#161617; --surface-2:#1F1F22; --ink:#F3EEDF; --muted:#A39C88;
  --line:#2C2921; --accent:#E0B43A; --accent-ink:#1A1405; --accent-soft:#2A2414;
  --gold:#E0B43A; --gold-deep:#E0B43A; --gold-ink:#1A1405;
  --tick:#F2845C; --tick-soft:#3A2016; --good:#5FC08A; --good-soft:#15291E; --warn:#E3B04F; --warn-soft:#33290F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;margin-top:-2px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 12px 11px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
main{padding-block:24px 64px}
.view{display:grid;gap:20px}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:14px}
.grid2{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:1.15fr .85fr}}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:5px 10px;font-size:.82rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--mono);font-size:1.6rem;font-weight:500;line-height:1.2;margin-top:4px}
.stat .s{font-size:.8rem;color:var(--muted)}

/* hero */
.hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.hero p{max-width:60ch;margin-top:6px}
.examset{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.examset input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;font-size:.88rem}
.bar-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.low{background:var(--tick)} .fill.mid{background:var(--warn)}

/* slots */
.slots{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.slot{position:relative;padding:0 0 14px 18px}
.slot::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.slot.brk::before{border-color:var(--line)}
.slot .t{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.slot .w{font-weight:600}
.slot .d{font-size:.87rem;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;background:var(--surface);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .tk{display:inline-block;width:14px;text-align:center;color:var(--gold-deep);font-weight:700}
.pill{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--tick-soft);color:var(--tick)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td .chips{display:flex;flex-wrap:wrap;gap:6px}
.pno{font-family:var(--mono);color:var(--muted);font-size:.8rem}

/* mcq */
.mcq-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
.q{font-family:var(--serif);font-size:1.2rem;line-height:1.4;margin:6px 0 16px;max-width:62ch}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:10px;cursor:pointer;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--tick);background:var(--tick-soft)}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.92rem;max-width:70ch}
.mcq-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}

/* planner */
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.field{display:grid;gap:5px;font-size:.85rem}
.field label,.field .lab{font-weight:600;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.dur{display:flex;gap:6px}
.dur input{width:40%}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.phasebar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.phasebar div{display:flex;align-items:center;padding-inline:8px;font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;color:var(--ink)}
.ph-concepts{background:var(--accent-soft)} .ph-revision{background:color-mix(in srgb,var(--accent) 34%,var(--surface))}
.ph-practice{background:var(--warn-soft)} .ph-final{background:var(--tick-soft)} .ph-daily{background:var(--accent-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* journey */
.journey{display:grid;gap:0}
.ms{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}
.ms:last-child{border-bottom:0}
.ms .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--gold-deep);margin-top:1px}
.ms.done .dot{border-color:var(--gold)}
.ms.doing .dot{border-color:var(--warn)}
.ms .nm{font-weight:600}
.ms .nt{font-size:.85rem;color:var(--muted)}
.log{display:flex;gap:4px;align-items:flex-end;height:90px;padding-top:6px}
.log .b{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.log .b.zero{background:var(--line)}
.logx{display:flex;gap:4px;font-size:.66rem;color:var(--muted);font-family:var(--mono)}
.logx span{flex:1;text-align:center}

/* guidance */
.tips{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tips ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;font-size:.92rem}
.callout{border-left:3px solid var(--gold);padding:4px 0 4px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
.btn:disabled{opacity:.45;cursor:default}
textarea{font:inherit;font-family:var(--mono);font-size:.8rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;resize:vertical}
/* welcome */
.welcome{display:grid;gap:28px;grid-template-columns:1fr;align-items:start;padding-top:8px}
@media (min-width:860px){.welcome{grid-template-columns:1fr 1fr;padding-top:28px}}
.feat{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.feat li{padding-left:26px;position:relative;max-width:48ch}
.feat li::before{content:"✓";position:absolute;left:0;top:0;color:var(--gold-deep);font-weight:700}
.lvls{display:grid;gap:8px}
.lvl{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px;cursor:pointer}
.lvl span{font-size:.82rem}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
/* test */
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.timer{font-size:1.2rem;font-weight:500;padding:4px 12px;border-radius:8px;background:var(--surface-2)}
.timer.bad{background:var(--tick-soft);color:var(--tick)}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:.82rem}
.pal button.done{background:var(--accent-soft);border-color:var(--accent)}
.pal button.cur{box-shadow:0 0 0 2px var(--ink)}
.review{display:grid;gap:0}
.rv{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv-h{display:flex;gap:10px;align-items:center}
.rv p{max-width:75ch}
/* v3 ui */
:root{--hero-bg:#111111;--hero-line:#111111;--hero-ink:#FFFFFF;--hero-muted:#B5AE9C;--hero-track:rgba(255,255,255,.14);--hero-ring:#E0B43A;--hero-field:rgba(255,255,255,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero-bg:#161617;--hero-line:#2C2921;--hero-ink:#F3EEDF;--hero-muted:#A39C88;--hero-track:rgba(255,255,255,.08);--hero-ring:#E0B43A;--hero-field:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--hero-bg:#161617;--hero-line:#2C2921;--hero-ink:#F3EEDF;--hero-muted:#A39C88;--hero-track:rgba(255,255,255,.08);--hero-ring:#E0B43A;--hero-field:rgba(255,255,255,.05)}
.ic{flex:none}
.tabs button{display:inline-flex;align-items:center;gap:7px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--ink)}
.seg .sm{display:none}
.stats.icons .eyebrow{display:flex;align-items:center;gap:6px}
.stats.icons .eyebrow .ic{color:var(--accent)}
.stat .v small{font-size:.8rem;color:var(--muted);font-family:var(--sans);font-weight:400}
.hc{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);border-radius:16px;padding:22px;display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center;justify-content:space-between}
.hc-bg{position:absolute;right:-50px;bottom:-80px;width:260px;height:260px;color:var(--hero-ink);opacity:.05;pointer-events:none}
.hc-main{position:relative;display:grid;gap:8px;min-width:0}
.hc-eb{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--hero-muted)}
.hc h1{font-size:1.7rem;color:var(--hero-ink)}
.hc-count{display:flex;align-items:center;gap:12px;line-height:1.2;color:var(--hero-muted);font-size:.9rem}
.hc-count .big{font-size:3.4rem;line-height:1;font-weight:500;color:var(--hero-ink);letter-spacing:-.03em}
.hc-set{color:var(--hero-muted)}
.hc-date{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--hero-muted)}
.hc-date input,.hc-log input{background:var(--hero-field);border:1px solid var(--hero-track);color:var(--hero-ink);border-radius:8px;padding:5px 8px;color-scheme:dark}
.hc-side{position:relative;display:grid;justify-items:center;gap:10px}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%}
.ring .rt{fill:none;stroke:var(--hero-track);stroke-width:8}
.ring .rp{fill:none;stroke:var(--hero-ring);stroke-width:8;stroke-linecap:round}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.rc b{font-size:1.5rem;font-weight:500}
.rc small{font-size:.8rem;color:var(--hero-muted)}
.rc span{font-size:.72rem;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.08em}
.hc-log{display:flex;gap:6px}
.hc-log input{width:74px}
.hc-log .btn{background:var(--hero-ink);color:var(--hero-bg);border-color:var(--hero-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bnav{display:none}
@media (max-width:719px){
  .top{padding-block:12px 8px}
  .brand small{display:none}
  .brand svg{width:30px;height:30px}
  #levelSeg{order:3;width:100%}
  #levelSeg button{flex:1}
  .seg .lg{display:none}.seg .sm{display:inline}
  .top{gap:10px}
  .top>.row{display:contents}
  .brand{flex:1;min-width:0}
  .acct{order:1}
  #themeBtn{order:2}
  #levelSeg{order:3}
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.66rem;font-weight:500;color:var(--muted);cursor:pointer}
  .bnav button[aria-selected="true"]{color:var(--accent)}
  .bnav button[aria-selected="true"] .ic{stroke-width:2.2}
  main{padding-block:16px 100px}
  h1{font-size:1.55rem}
  .hc{padding:18px}
  .hc h1{font-size:1.35rem}
  .hc-count .big{font-size:2.8rem}
  .hc-side{grid-template-columns:auto auto;align-items:center;justify-content:start;width:100%;gap:14px}
  .ring{width:92px;height:92px}
  .rc b{font-size:1.2rem}
  .who{max-width:120px}
}
/* v4 brand */
.btn{border-radius:999px;padding:8px 16px}
.btn.sm{padding:5px 12px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.outline{border-color:var(--ink);background:transparent;font-weight:600}
.stat .v,.hc-count .big,.rc b,.brand b,.q{font-family:var(--serif)}
.stat .v{font-weight:600}
.hc{border:1px solid var(--hero-line)}
.hc h1{font-weight:600}
.hc-count .big{color:var(--gold);font-weight:600}
.hc-log .btn{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.stats.icons .eyebrow .ic{color:var(--gold-deep)}
.bnav button[aria-selected="true"]{color:var(--ink)}
.bnav button[aria-selected="true"] .ic{color:var(--gold-deep)}
.field input,.field select,select,textarea{border-radius:10px}
.auth{max-width:440px;margin:28px auto 0;display:grid;gap:18px}
.auth-head{text-align:center;display:grid;justify-items:center;gap:8px}
.auth-head h1{font-size:1.75rem}
.mark{width:54px;height:54px;border-radius:15px;background:var(--accent);display:grid;place-items:center}
.auth .card{padding:22px;border-radius:18px}
.auth .seg{display:flex}
.auth .seg button{flex:1}
.auth .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chipsrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chipsrow span{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--surface)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (min-width:720px){.toast{bottom:32px}}
/* accounts */
.acct{display:flex;align-items:center;gap:8px;font-size:.85rem}
.acct:empty{display:none}
.acct a.btn{text-decoration:none;color:var(--ink)}
.who{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.amsg{font-size:.88rem;padding:9px 12px;border-radius:8px;background:var(--accent-soft);margin-bottom:12px}
.amsg.err{background:var(--tick-soft);color:var(--tick)}
.or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.field input[type=email],.field input[type=password],.field input[type=text]{font-size:16px}
</style>

function accuracy(){
  const out={};L().papers.forEach(p=>out[p.id]={n:0,ok:0});
  S.mcq.forEach(m=>{if(out[m.p]){out[m.p].n++;if(m.ok)out[m.p].ok++}});
  return out;
}
function streak(){
  const active=new Set(Object.keys(S.log).filter(k=>S.log[k]>0).concat(S.mcq.map(m=>m.t)));
  let n=0,d=new Date(today);if(!active.has(iso(d)))d=addDays(d,-1);
  while(active.has(iso(d))){n++;d=addDays(d,-1)}return n;
}
function resDone(){const a=L().attempts[0];let n=0,t=0;L().papers.forEach(p=>RES.forEach(r=>{t++;if(S.done[p.id+"|"+a+"|"+r[0]])n++}));return {n,t,a}}
function weakest(){
  const acc=accuracy();let w=null;
  for(const id in acc){const x=acc[id];if(x.n>=2){const r=x.ok/x.n;if(!w||r<w.r)w={id,r,n:x.n}}}
  return w;
}

/* ---------- planner engine ---------- */
function alloc(n,weights){
  const sum=weights.reduce((a,b)=>a+b,0);const raw=weights.map(w=>w/sum*n);
  const out=raw.map(Math.floor);let left=n-out.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){out[i]++;left--}});
  return out;
}
const PH={concepts:["Concepts","Learn chapters, work ICAI module illustrations"],revision:["Revision","Second reading, solve module questions & past papers"],practice:["RTP · MTP","Timed papers, then review every mistake"],final:["Final revision","Summary notes, amendments, formula sheets"]};
function buildPlan(opt){
  const lv=LEVELS[opt.level];
  let papers=lv.papers.filter(p=>!lv.groups||opt.groups==="both"||(opt.groups==="g1"?p.g===1:p.g===2));
  const days=Math.max(1,Math.min(730,Math.round(opt.unit==="days"?opt.dur:opt.unit==="weeks"?opt.dur*7:opt.dur*30.4)));
  const weights=papers.map(p=>opt.weak.includes(p.id)?1.4:1);
  const wsum=weights.reduce((a,b)=>a+b,0);
  const restDays=opt.rest&&days>=7?Array.from({length:days},(_,i)=>addDays(opt.start,i).getDay()===0).filter(Boolean).length:0;
  const hours=Math.round((days-restDays)*opt.hpd+restDays*opt.hpd*0.4);
  const perPaper=papers.map((p,i)=>({p,h:Math.round(hours*weights[i]/wsum)}));
  if(days===1)return {days,papers,hours,perPaper,daily:true,list:[{date:opt.start,phase:"daily",main:papers[0],alt:papers[1]||papers[0]}]};
  let split=days>=60?[["concepts",.55],["revision",.2],["practice",.15],["final",.1]]:days>=21?[["concepts",.4],["revision",.25],["practice",.25],["final",.1]]:[["revision",.5],["practice",.35],["final",.15]];
  const pd=alloc(days,split.map(s=>s[1]));
  const phases=split.map((s,i)=>({key:s[0],days:pd[i]})).filter(p=>p.days>0);
  const list=[];let cursor=0;
  phases.forEach(ph=>{
    const idx=[];for(let i=0;i<ph.days;i++){const d=addDays(opt.start,cursor+i);const rest=opt.rest&&days>=7&&d.getDay()===0;list.push({date:d,phase:ph.key,rest});if(!rest)idx.push(list.length-1)}
    cursor+=ph.days;
    if(ph.key==="practice"){idx.forEach((li,k)=>list[li].main=papers[k%papers.length])}
    else{
      const c=idx.length>=papers.length?alloc(idx.length,weights):papers.map((_,i)=>i<idx.length?1:0);
      let k=0;papers.forEach((p,pi)=>{for(let j=0;j<c[pi];j++)list[idx[k++]].main=p});
    }
    idx.forEach(li=>{const m=list[li].main;const others=papers.filter(p=>p!==m);list[li].alt=others.length?others[(li)%others.length]:m});
  });
  return {days,papers,hours,perPaper,phases,list};
}
function slotsFor(entry,hpd){
  const m=entry.main,a=entry.alt||m;const H=Math.max(1,hpd)*60;
  const ph=entry.phase;
  const blocks=ph==="practice"?[
    [0.5,m,"Attempt a full MTP/RTP paper under exam timing"],[0.25,m,"Check against suggested answers; log every mistake"],[0.15,a,"Revise weak chapters from mistake log"],[0.1,null,"MCQ sprint — 15 questions"]]
   :ph==="final"?[[0.45,m,"Rapid revision from your summary notes"],[0.25,m,"Amendments, formula sheet, key definitions"],[0.2,a,"One mixed question set"],[0.1,null,"MCQ sprint — 15 questions"]]
   :ph==="revision"?[[0.45,m,"Revise one chapter + solve module questions"],[0.25,a,"Past-paper questions, timed"],[0.15,null,"MCQ sprint — 20 questions"],[0.15,null,"Re-read yesterday's notes"]]
   :[[0.45,m,"New chapter — read the module, work every illustration"],[0.3,a,"Theory reading and short notes"],[0.125,null,"MCQ sprint — 15 questions"],[0.125,null,"Revise yesterday's work"]];
  if(entry.rest)return [{t:"Any time",w:"Light day",d:"Revise the week's notes and do one MCQ set. Rest is part of the plan."}];
  let t=7*60;const out=[];
  blocks.forEach((b,i)=>{const mins=Math.round(H*b[0]/15)*15;if(mins<=0)return;
    out.push({t:hm(t)+"–"+hm(t+mins),w:b[1]?"P"+b[1].no+" · "+b[1].name:(b[2].startsWith("MCQ")?"MCQ practice":"Revision"),d:b[2]});t+=mins;
    if(i<blocks.length-1&&mins>=60){out.push({t:hm(t)+"–"+hm(t+15),w:"Break",d:"",brk:true});t+=15}});
  return out;
}
function hm(m){m=m%(24*60);const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0")}

/* ---------- MCQ engine ---------- */
let cur=null,answered=false,sess={n:0,ok:0},mode="practice",T=null,tick=null;
const inLevel=q=>L().papers.some(p=>p.id===q.p);
function mistakes(){return Q.filter(q=>S.wrong[q.id]&&inLevel(q))}
function pool(){
  if(mode==="mistakes")return mistakes();
  const f=window.__mp&&window.__mp!=="all"?[window.__mp]:L().papers.map(p=>p.id);return Q.filter(q=>f.includes(q.p));
}
function pick(){const pl=pool();if(!pl.length){cur=null;return}let n;do{n=pl[Math.floor(Math.random()*pl.length)]}while(pl.length>1&&cur&&n.id===cur.id);cur=n;answered=false}
function record(q,ok){S.mcq.push({id:q.id,p:q.p,ok,t:iso(today)});if(S.mcq.length>2000)S.mcq=S.mcq.slice(-2000);if(ok)delete S.wrong[q.id];else S.wrong[q.id]=1}
function paintMcq(){if(mode==="test"){if(T&&T.active)paintTest()}else paintQ()}
function paintQ(){
  if(!cur||!pool().includes(cur))pick();
  const box=document.getElementById("qbox");if(!box)return;
  const sEl=document.getElementById("sess");if(sEl)sEl.textContent=sess.n?`This session: ${sess.ok}/${sess.n}`:"";
  if(!cur){box.innerHTML=`<p class="muted">${mode==="mistakes"?"Zero mistakes left. Shabaash!":"No questions for this paper yet."}</p>`;return}
  const p=paper(cur.p);
  box.innerHTML=`<span class="pill">P${p.no} · ${esc(p.name)}</span><p class="q">${esc(cur.q)}</p>
   <div class="opts">${cur.o.map((o,i)=>`<button class="opt" data-opt="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
   <div id="why"></div><div class="mcq-foot"><span class="muted" style="font-size:.85rem">${pool().length} questions in this set</span><button class="btn primary" data-act="nextq">Next one</button></div>`;
}
function answer(i){
  if(answered||!cur)return;answered=true;const ok=i===cur.a;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===cur.a)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  document.getElementById("why").innerHTML=`<div class="why"><b style="color:${ok?"var(--good)":"var(--tick)"}">${ok?["Nailed it!","Sahi jawab!","Correct!","Spot on!"][Math.floor(Math.random()*4)]:"Not quite — it's "+"ABCD"[cur.a]+"."}</b> ${esc(cur.w)}</div>`;
  record(cur,ok);sess.n++;if(ok)sess.ok++;save();document.getElementById("sess").textContent=`This session: ${sess.ok}/${sess.n}`;
}
/* timed test */
function startTest(pid,n,per){
  let pl=Q.filter(q=>inLevel(q)&&(pid==="all"||q.p===pid));
  for(let i=pl.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pl[i],pl[j]]=[pl[j],pl[i]]}
  pl=pl.slice(0,Math.min(n,pl.length));if(!pl.length)return;
  T={qs:pl,ans:pl.map(()=>null),i:0,start:Date.now(),limit:pl.length*per,active:true,done:false};
  clearInterval(tick);tick=setInterval(()=>{const left=T.limit-Math.floor((Date.now()-T.start)/1000);const el=document.getElementById("tmr");if(el){el.textContent=hm2(Math.max(0,left));el.classList.toggle("bad",left<60)}if(left<=0)finishTest()},500);
}
function hm2(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function paintTest(){
  const box=document.getElementById("qbox");if(!box||!T)return;const q=T.qs[T.i],p=paper(q.p),left=T.limit-Math.floor((Date.now()-T.start)/1000);
  box.innerHTML=`<div class="card"><div class="mcq-top"><div class="row"><span class="pill">Q ${T.i+1} of ${T.qs.length}</span><span class="pill">P${p.no} · ${esc(p.name)}</span></div><span class="timer num ${left<60?"bad":""}" id="tmr">${hm2(Math.max(0,left))}</span></div>
   <p class="q">${esc(q.q)}</p><div class="opts">${q.o.map((o,i)=>`<button class="opt ${T.ans[T.i]===i?"sel":""}" data-topt="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
   <div class="mcq-foot"><div class="row"><button class="btn" data-act="tprev" ${T.i===0?"disabled":""}>Previous</button><button class="btn" data-act="tnext" ${T.i===T.qs.length-1?"disabled":""}>Next</button></div><button class="btn primary" data-act="tsubmit">Submit test</button></div>
   <div class="pal">${T.qs.map((_,i)=>`<button data-goto="${i}" class="${i===T.i?"cur":""} ${T.ans[i]!==null?"done":""}">${i+1}</button>`).join("")}</div>
   <p class="muted" style="font-size:.8rem;margin-top:8px">${T.ans.filter(a=>a!==null).length} answered · ${T.ans.filter(a=>a===null).length} left</p></div>`;
}
function finishTest(){
  if(!T||!T.active)return;clearInterval(tick);T.active=false;T.done=true;T.secs=Math.min(T.limit,Math.floor((Date.now()-T.start)/1000));
  let ok=0;T.qs.forEach((q,i)=>{const r=T.ans[i]===q.a;if(r)ok++;record(q,r)});T.ok=ok;
  S.tests.push({t:iso(today),lv:S.level,n:T.qs.length,ok,secs:T.secs});if(S.tests.length>50)S.tests=S.tests.slice(-50);save();
  if(tab==="mcq")render();
}
function testResults(){
  const pct=Math.round(T.ok/T.qs.length*100);const by={};T.qs.forEach((q,i)=>{by[q.p]=by[q.p]||{n:0,ok:0};by[q.p].n++;if(T.ans[i]===q.a)by[q.p].ok++});
  return `<div class="stats"><div class="stat"><div class="eyebrow">Score</div><div class="v">${T.ok}/${T.qs.length}</div><div class="s">${pct}% correct</div></div>
   <div class="stat"><div class="eyebrow">Time taken</div><div class="v">${hm2(T.secs)}</div><div class="s">of ${hm2(T.limit)}</div></div>
   <div class="stat"><div class="eyebrow">Unanswered</div><div class="v">${T.ans.filter(a=>a===null).length}</div><div class="s">questions</div></div>
   <div class="stat"><div class="eyebrow">Verdict</div><div class="v" style="font-size:1.1rem;padding-top:6px">${pct>=70?"Exam-ready":pct>=50?"Almost there":"Revise first"}</div><div class="s">${pct>=70?"keep this energy":pct>=50?"fix the misses below":"ho jayega — back to the module"}</div></div></div>
   <div class="card"><div class="card-h"><h2>By paper</h2></div><div class="bars">${Object.keys(by).map(id=>{const p=paper(id),x=by[id],r=Math.round(x.ok/x.n*100);return `<div class="bar-row"><span class="lbl"><span class="pno">P${p.no}</span> ${esc(p.name)}</span><span class="num" style="text-align:right">${x.ok}/${x.n}</span><div class="track"><div class="fill ${r<50?"low":r<70?"mid":""}" style="width:${r}%"></div></div></div>`}).join("")}</div></div>
   <div class="card"><div class="card-h"><h2>Review</h2><div class="row"><button class="btn sm" data-act="newtest">New test</button><button class="btn sm primary" data-mode="mistakes">Fix my mistakes</button></div></div>
   <div class="review">${T.qs.map((q,i)=>{const a=T.ans[i],r=a===q.a;return `<div class="rv ${r?"ok":"no"}"><div class="rv-h"><span class="num muted">${i+1}</span><span class="pill ${r?"good":"bad"}">${r?"Correct":a===null?"Skipped":"Wrong"}</span></div><p><b>${esc(q.q)}</b></p><p class="muted" style="font-size:.9rem">${a!==null&&!r?`You: ${"ABCD"[a]}. ${esc(q.o[a])} · `:""}Answer: ${"ABCD"[q.a]}. ${esc(q.o[q.a])}</p><p style="font-size:.9rem">${esc(q.w)}</p></div>`}).join("")}</div></div>`;
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
/* backup */
function backupCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function restoreCode(c){try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!o||!o.level||!LEVELS[o.level])return false;S=o;S.wrong=S.wrong||{};S.tests=S.tests||[];S.onboarded=true;save();return true}catch(e){return false}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-tab]");if(!t)return;
  if(t.dataset.wlevel){W.level=t.dataset.wlevel;document.querySelectorAll("[data-wlevel]").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t.dataset.level){if(T&&T.active)return;S.level=t.dataset.level;S.plan.weak=[];cur=null;T=null;sess={n:0,ok:0};window.__mp="all";save();render();return}
  if(t.dataset.mode){if(T&&T.active&&t.dataset.mode!=="test")return;mode=t.dataset.mode;if(mode==="mistakes"){T=T&&T.done?null:T}cur=null;tab="mcq";render();window.scrollTo({top:0});return}
  if(t.dataset.topt!==undefined){T.ans[T.i]=+t.dataset.topt;paintTest();return}
  if(t.dataset.goto!==undefined){T.i=+t.dataset.goto;paintTest();return}
  if(t.dataset.tab){tab=t.dataset.tab;try{localStorage.setItem(K+".tab",tab)}catch(_){}render();window.scrollTo({top:0});return}
  if(t.dataset.done){const k=t.dataset.done;if(S.done[k])delete S.done[k];else S.done[k]=1;save();render();return}
  if(t.dataset.ms!==undefined){const i=t.dataset.ms;const st=S.ms[i]||"todo";S.ms[i]=st==="todo"?"doing":st==="doing"?"done":"todo";if(S.ms[i]==="todo")delete S.ms[i];save();render();return}
  if(t.dataset.weak){const w=new Set(S.plan.weak||[]);w.has(t.dataset.weak)?w.delete(t.dataset.weak):w.add(t.dataset.weak);S.plan.weak=[...w];save();render();return}
  if(t.dataset.preset){const [d,u]=t.dataset.preset.split("|");S.plan.dur=+d;S.plan.unit=u;save();render();return}
  if(t.dataset.opt!==undefined){answer(+t.dataset.opt);return}
  if(t.dataset.aview){authView=t.dataset.aview;authMsg="";authErr=false;render();return}
  if(t.dataset.auth){authDo(t.dataset.auth);return}
  const a=t.dataset.act;
  if(a==="signout"){signOut();return}
  if(a==="theme"){THEME=isDark()?"light":"dark";try{localStorage.setItem("prepx.theme",THEME)}catch(_){}applyTheme();renderChrome();return}
  if(a==="nextq"){pick();paintQ()}
  if(a==="fresh"){const keepUid=S.uid;S=blank(S.level);S.uid=keepUid;W.level=S.level;save();render()}
  if(a==="demo"){const keepUid=S.uid;S=sample();S.uid=keepUid;tab="dashboard";save();render()}
  if(a==="start"){const lvl=W.level;const keepUid=S.uid;S=blank(lvl);S.uid=keepUid;S.onboarded=true;S.name=(document.getElementById("wName").value||"").trim().slice(0,40);
    S.exam[lvl]=document.getElementById("wExam").value||"";S.plan.hpd=Math.max(1,Math.min(16,parseFloat(document.getElementById("wH").value)||6));
    tab="dashboard";save();render();window.scrollTo({top:0})}
  if(a==="starttest"){startTest(document.getElementById("tP").value,+document.getElementById("tN").value,+document.getElementById("tM").value);render()}
  if(a==="tprev"&&T){T.i=Math.max(0,T.i-1);paintTest()}
  if(a==="tnext"&&T){T.i=Math.min(T.qs.length-1,T.i+1);paintTest()}
  if(a==="tsubmit")finishTest();
  if(a==="newtest"){T=null;render()}
  if(a==="backup"){const code=backupCode();const msg=document.getElementById("bkMsg");
    const fallback=()=>{const ta=document.getElementById("restoreTxt");ta.value=code;ta.select();msg.textContent="Select and copy the code in the box below."};
    try{navigator.clipboard.writeText(code).then(()=>{msg.textContent="Copied. Paste it somewhere safe, like a note to yourself."},fallback)}catch(_){fallback()}}
  if(a==="restore"){const v=document.getElementById("restoreTxt").value;if(restoreCode(v)){render();const m=document.getElementById("bkMsg");if(m)m.textContent="Progress restored."}else{document.getElementById("bkMsg").textContent="That code didn't work — check you copied all of it."}}
  if(a==="reset1"){document.getElementById("resetBox").innerHTML=`<span style="font-size:.85rem">This clears all progress on this device.</span><button class="btn sm" data-act="reset0">Cancel</button><button class="btn sm primary" style="background:var(--tick);border-color:var(--tick)" data-act="reset2">Yes, reset</button>`}
  if(a==="reset0")render();
  if(a==="reset2"){clearInterval(tick);T=null;const keepUid=S.uid;S=blank();S.uid=keepUid;tab="dashboard";save();render();window.scrollTo({top:0})}
  if(a==="logh"){const v=parseFloat(document.getElementById("logH").value);if(!isNaN(v)&&v>=0){S.log[iso(today)]=Math.min(16,v);save();render();const st=streak();
    toast(v>=S.plan.hpd?"Target smashed. Shabaash!":st>=3?`${st}-day streak — keep it going!`:"Logged. Every hour counts.")}}
});
document.addEventListener("change",e=>{
  const id=e.target.id,v=e.target.value;
  if(id==="examDate"){S.exam[S.level]=v;save();render()}
  if(id==="att"){window.__att=v;render()}
  if(id==="mcqP"){window.__mp=v;cur=null;paintQ()}
  if(id==="pDur"){const n=Math.max(1,Math.min(730,parseInt(v)||1));S.plan.dur=n;save();render()}
  if(id==="pUnit"){S.plan.unit=v;save();render()}
  if(id==="pH"){S.plan.hpd=Math.max(1,Math.min(16,parseFloat(v)||1));save();render()}
  if(id==="pG"){S.plan.groups=v;S.plan.weak=[];save();render()}
  if(id==="pR"){S.plan.rest=v==="1";save();render()}
});
async function boot(){
  if(!sb){render();return}
  render();
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==="PASSWORD_RECOVERY"){session=s;recovering=true;authView="newpass";authMsg="";render()}
    if(ev==="SIGNED_OUT"&&session){session=null;render()}
  });
  try{const {data}=await sb.auth.getSession();session=data.session}catch(e){session=null}
  if(session&&!recovering)await afterSignIn(false);
  authReady=true;render();
}
boot();
})();
</script>
