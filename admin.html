<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA PrepX Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7EF; --surface:#FFFFFF; --surface-2:#F3EEE1; --ink:#141414; --muted:#6B6558;
  --line:#E6DFCC; --accent:#111111; --accent-ink:#E0B43A; --accent-soft:#F6EDD2;
  --tick:#C2410C; --tick-soft:#FBE4D8; --warn:#C8961E; --warn-soft:#F6EBCB;
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;
  --bg:#0B0B0C; --surface:#161617; --surface-2:#1F1F22; --ink:#F3EEDF; --muted:#A39C88;
  --line:#2C2921; --accent:#E0B43A; --accent-ink:#1A1405; --accent-soft:#2A2414;
  --tick:#F2845C; --tick-soft:#3A2016; --warn:#8A7A55; --warn-soft:#33290F;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:1.8rem} h2{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--serif);font-size:1.2rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.88rem;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
main{display:grid;gap:20px;padding-block:8px 60px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:760px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin-top:4px}
.stat .s{font-size:.8rem;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line);padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.col .e{background:var(--accent);border-radius:2px 2px 0 0}
.col .g{background:var(--warn)}
.col .e+.g{border-radius:0}
.col .g:first-child{border-radius:2px 2px 0 0}
.xl{display:flex;gap:3px;font-size:.66rem;color:var(--muted);font-family:var(--mono);margin-top:4px}
.xl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.pill.g{background:var(--warn-soft);color:var(--ink)}
input[type=search],input[type=email],input[type=password]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.login{max-width:380px;margin:40px auto;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.msg{font-size:.88rem;padding:9px 12px;border-radius:8px;background:var(--tick-soft);color:var(--tick)}
.an-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.an-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.an-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;font-size:.88rem}
.an-t{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.an-t i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.an-s{grid-column:1/-1;font-size:.75rem}
.an-heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:3px;font-size:.68rem;color:var(--muted)}
.an-heat i{display:block;aspect-ratio:1;border-radius:3px;min-height:10px}
.an-hy{align-self:center}.an-hx{text-align:center}
.an-row:hover td{background:var(--surface-2)}
:root{--heat:#9C7400}
@media (prefers-color-scheme: dark){:root{--heat:#E0B43A}}
#topAct{min-width:0;max-width:100%}#vw{display:flex;max-width:100%;overflow-x:auto}#vw button{white-space:nowrap;flex:none}
</style>
</head>
<body>
<header class="wrap top">
  <div class="brand">
    <img src="/logo-180.png" alt="CA PrepX logo" width="34" height="34" style="border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line)">
    <div><b>CA PrepX</b> <span class="muted">· Admin</span></div>
  </div>
  <div class="row" id="topAct"></div>
</header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
(function(){
const CFG=window.PREPX_CONFIG||{};
const main=document.getElementById("main"),top=document.getElementById("topAct");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!CFG.url||!CFG.anonKey||!window.supabase){main.innerHTML=`<div class="card"><h2>Not connected yet</h2><p class="muted" style="margin-top:6px">Add your Supabase URL and key to <b>config.js</b>, then reload.</p></div>`;return}
const sb=window.supabase.createClient(CFG.url,CFG.anonKey);
let profiles=[],logins=[],filter="all",q="",view="students",jobs=[],jq="",jmsg="",papersA=[],qcount={},vidsA=[],chansA=[],vq="",vlv="all",amsg="";
const LV={foundation:"Foundation",inter:"Intermediate",final:"Final"};
const d2=d=>new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};

function loginForm(err){
  top.innerHTML=`<a class="btn" href="/">Open site</a>`;
  main.innerHTML=`<div class="card login"><h1>Admin sign in</h1>${err?`<p class="msg">${esc(err)}</p>`:""}
   <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
   <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
   <button class="btn primary" id="go">Sign in</button></div>`;
  const go=async()=>{const b=document.getElementById("go");b.disabled=true;b.textContent="Signing in…";
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value});
    if(error)return loginForm(error.message);start()};
  document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function start(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return loginForm();
  const r=await sb.rpc("is_admin");
  if(!r.data){top.innerHTML=`<button class="btn" id="so">Sign out</button>`;document.getElementById("so").onclick=async()=>{await sb.auth.signOut();loginForm()};
    main.innerHTML=`<div class="card"><h2>This account isn't an admin</h2><p class="muted" style="margin-top:6px">Signed in as ${esc(data.session.user.email||"a guest")}. Run the "make yourself admin" line in supabase-setup.sql for your account, then reload.</p></div>`;return}
  top.innerHTML=`<div class="seg" id="vw"><button data-v="students" aria-pressed="true">Students</button><button data-v="analytics" aria-pressed="false">Analytics</button><button data-v="jobs" aria-pressed="false">Jobs</button><button data-v="papers" aria-pressed="false">Mock papers</button><button data-v="videos" aria-pressed="false">Videos</button><button data-v="checkers" aria-pressed="false">Checkers</button></div><a class="btn" href="/">Open site</a><button class="btn" id="rf">Refresh</button><button class="btn" id="so">Sign out</button>`;
  document.querySelectorAll("#vw [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("#vw [data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));load()});
  document.getElementById("rf").onclick=load;document.getElementById("so").onclick=async()=>{await sb.auth.signOut();loginForm()};
  load();
}

/* ---------- Teacher checkers ---------- */
let cmsg="";
async function loadCheckers(){
  const [c,s]=await Promise.all([sb.from("checkers").select("*").order("added_at",{ascending:true}),sb.from("submissions").select("id,status,checker_id,created_at,checked_at").limit(5000)]);
  if(c.error){main.innerHTML=`<div class="card"><h2>Teacher checking isn't set up</h2><p class="muted" style="margin-top:6px">Run <b>teacher-check-setup.sql</b> in Supabase → SQL Editor, then click Refresh.</p><p class="msg" style="margin-top:8px">${esc(c.error.message)}</p></div>`;return}
  const C=c.data||[],S=s.data||[];const by=id=>S.filter(x=>x.checker_id===id);
  const wait=S.filter(x=>x.status==="submitted").length,rev=S.filter(x=>x.status==="in_review").length,done=S.filter(x=>x.status==="checked").length;
  main.innerHTML=`<div class="row sp"><div><div class="eyebrow">Teacher checking</div><h1>Checkers</h1></div><a class="btn" href="/checker">Open teacher portal</a></div>
  <div class="stats"><div class="stat"><div class="eyebrow">Teachers</div><div class="v">${C.length}</div><div class="s">with checker access</div></div>
   <div class="stat"><div class="eyebrow">Waiting</div><div class="v">${wait}</div><div class="s">answer sheets not picked up</div></div>
   <div class="stat"><div class="eyebrow">Being checked</div><div class="v">${rev}</div><div class="s">in progress</div></div>
   <div class="stat"><div class="eyebrow">Checked</div><div class="v">${done}</div><div class="s">all time</div></div>
   <div class="stat"><div class="eyebrow">Uploads</div><div class="v">${S.length}</div><div class="s">total</div></div></div>
  <div class="card"><h2>Add a teacher</h2><p class="muted" style="margin:4px 0 12px">They first create a normal account on caprepx.com with this email. Then add it here and they can sign in at <b>caprepx.com/checker</b>.</p>
   <div class="row"><input type="email" id="ce" placeholder="teacher@email.com" style="min-width:240px"><input type="search" id="cn" placeholder="Name shown to students (optional)" style="min-width:220px"><button class="btn primary" id="cadd">Add teacher</button></div>
   ${cmsg?`<p class="${cmsg.startsWith("!")?"msg":"muted"}" style="margin-top:8px">${esc(cmsg.replace(/^!/,""))}</p>`:""}</div>
  <div class="tbl"><table><thead><tr><th>Teacher</th><th>Email</th><th>Added</th><th style="text-align:right">Checked</th><th style="text-align:right">In progress</th><th></th></tr></thead><tbody>
  ${C.length?C.map(x=>`<tr><td>${esc(x.name||"—")}</td><td>${esc(x.email||"")}</td><td class="num">${new Date(x.added_at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</td><td class="num" style="text-align:right">${by(x.user_id).filter(z=>z.status==="checked").length}</td><td class="num" style="text-align:right">${by(x.user_id).filter(z=>z.status==="in_review").length}</td><td><button class="btn" data-crm="${x.user_id}">Remove</button></td></tr>`).join(""):`<tr><td colspan="6" class="muted">No teachers yet. Add one above.</td></tr>`}
  </tbody></table></div>`;
  document.getElementById("cadd").onclick=async()=>{const e=document.getElementById("ce").value.trim(),n=document.getElementById("cn").value.trim();if(!e){cmsg="!Enter the teacher's email.";return loadCheckers()}
    const r=await sb.rpc("add_checker",{p_email:e,p_name:n||null});cmsg=r.error?"!"+r.error.message:r.data==="not_found"?`!No account found for ${e}. Ask them to sign up on caprepx.com first, then add them again.`:`Added ${e}. They can sign in at caprepx.com/checker.`;loadCheckers()};
  document.querySelectorAll("[data-crm]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tap again to remove";return}const r=await sb.rpc("remove_checker",{p_user:b.dataset.crm});cmsg=r.error?"!"+r.error.message:"Removed.";loadCheckers()});
}
async function load(){
  main.innerHTML=`<p class="muted">Loading…</p>`;
  if(view==="analytics")return loadAnalytics();
  if(view==="jobs")return loadJobs();
  if(view==="papers")return loadPapersA();
  if(view==="videos")return loadVideosA();
  if(view==="checkers")return loadCheckers();
  const since=new Date(Date.now()-29*864e5);since.setHours(0,0,0,0);
  const [p,l]=await Promise.all([
    sb.from("profiles").select("*").order("last_login",{ascending:false,nullsFirst:false}).limit(5000),
    sb.from("logins").select("user_id,is_guest,at").gte("at",since.toISOString()).order("at",{ascending:false}).limit(20000)
  ]);
  if(p.error||l.error){main.innerHTML=`<div class="card"><p class="msg">${esc((p.error||l.error).message)}</p></div>`;return}
  profiles=p.data||[];logins=l.data||[];paint();
}
function paint(){
  const now=new Date(),today=dayKey(now);
  const emails=profiles.filter(x=>!x.is_guest).length,guests=profiles.length-emails;
  const totalLogins=profiles.reduce((a,x)=>a+(x.login_count||0),0);
  const todayUsers=new Set(logins.filter(x=>dayKey(x.at)===today).map(x=>x.user_id)).size;
  const wk=Date.now()-7*864e5;const wkLogins=logins.filter(x=>new Date(x.at)>=wk).length;
  const newWk=profiles.filter(x=>new Date(x.created_at)>=wk).length;
  // chart: 30 days
  const days=[];for(let i=29;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push({d,k:dayKey(d),e:0,g:0})}
  const idx={};days.forEach((x,i)=>idx[x.k]=i);
  logins.forEach(x=>{const i=idx[dayKey(x.at)];if(i!==undefined)x.is_guest?days[i].g++:days[i].e++});
  const mx=Math.max(4,...days.map(x=>x.e+x.g));
  const rows=profiles.filter(x=>(filter==="all"||(filter==="guest")===!!x.is_guest)&&(!q||((x.email||"")+" "+(x.name||"")).toLowerCase().includes(q)));
  main.innerHTML=`
  <div><div class="eyebrow">Updated ${d2(now)}</div><h1>Who's using CA PrepX</h1></div>
  <div class="stats">
    <div class="stat"><div class="eyebrow">Students</div><div class="v">${profiles.length}</div><div class="s">${emails} with account · ${guests} visitors</div></div>
    <div class="stat"><div class="eyebrow">Total logins</div><div class="v">${totalLogins}</div><div class="s">all time</div></div>
    <div class="stat"><div class="eyebrow">Active today</div><div class="v">${todayUsers}</div><div class="s">students</div></div>
    <div class="stat"><div class="eyebrow">Logins · 7 days</div><div class="v">${wkLogins}</div><div class="s">sign-ins and visits</div></div>
    <div class="stat"><div class="eyebrow">New · 7 days</div><div class="v">${newWk}</div><div class="s">students joined</div></div>
  </div>
  <div class="card"><div class="row sp" style="margin-bottom:12px"><h2>Logins per day</h2><div class="legend"><span><i style="background:var(--accent)"></i>Email</span><span><i style="background:var(--warn)"></i>Visitor</span></div></div>
    <div class="chart">${days.map(x=>`<div class="col" title="${x.d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}: ${x.e} email, ${x.g} guest">${x.g?`<div class="g" style="height:${x.g/mx*100}%"></div>`:""}${x.e?`<div class="e" style="height:${x.e/mx*100}%"></div>`:""}</div>`).join("")}</div>
    <div class="xl">${days.map((x,i)=>`<span>${i%5===4||i===29?x.d.getDate()+" "+x.d.toLocaleDateString("en-GB",{month:"short"}):""}</span>`).join("")}</div>
    <p class="muted" style="font-size:.8rem;margin-top:8px">Last 30 days. Peak: ${Math.max(...days.map(x=>x.e+x.g))} logins in a day.</p></div>
  <div class="row sp"><h2>Students</h2><div class="row"><input type="search" id="q" placeholder="Search name or email" value="${esc(q)}"><div class="seg">${[["all","All"],["email","Accounts"],["guest","Visitors"]].map(f=>`<button data-f="${f[0]}" aria-pressed="${filter===f[0]}">${f[1]}</button>`).join("")}</div></div></div>
  <div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Type</th><th>Level</th><th style="text-align:right">Logins</th><th>Last login</th><th>Joined</th></tr></thead><tbody>
  ${rows.length?rows.map(x=>`<tr><td>${esc(x.name)||'<span class="muted">—</span>'}</td><td>${x.email?esc(x.email):'<span class="muted">—</span>'}</td><td><span class="pill ${x.is_guest?"g":""}">${x.is_guest?"Visitor":"Account"}</span></td><td>${esc(LV[x.level]||x.level||"—")}</td><td class="num" style="text-align:right">${x.login_count||0}</td><td class="num">${x.last_login?d2(x.last_login):"—"}</td><td class="num">${d2(x.created_at)}</td></tr>`).join(""):`<tr><td colspan="7" class="muted">No students match.</td></tr>`}
  </tbody></table></div>
  <p class="muted" style="font-size:.8rem">Visitors are people using the site without an account (counted once per visit). Accounts are students who signed up with email.</p>`;
  const qi=document.getElementById("q");qi.oninput=()=>{q=qi.value.trim().toLowerCase();const pos=qi.selectionStart;paint();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;paint()});
}
const JF=[["title","Job title",1],["company","Company",1],["short","Short name for LinkedIn search (e.g. EY)",0],["type","Employer type (Big 4, Mid-tier firm, Corporate, GCC / MNC, Bank / NBFC, Investment bank, Fintech)",0],["domain","Area: audit, ia, dt, gst, fpa, ctrl, ta, cons, forensic, ib, articleship",1],["city","City: delhi, mumbai, bengaluru, pune, hyderabad, dubai, india",1],["location","Location shown (e.g. Gurugram, Haryana)",0],["stage","Level: student, fresher, exp (comma-separated)",1],["exp","Experience / eligibility",0],["apply","Apply link",1],["careers","Company careers page (optional)",0],["email","Official recruitment email (optional)",0],["seen","Date seen (YYYY-MM-DD)",0]];
async function loadJobs(){
  const r=await sb.from("jobs").select("*").order("seen",{ascending:false}).limit(2000);
  if(r.error){main.innerHTML=`<div class="card"><h2>Jobs table not set up</h2><p class="muted" style="margin-top:6px">Run <b>jobs-setup.sql</b> in Supabase → SQL Editor, then click Refresh.</p><p class="msg" style="margin-top:10px">${esc(r.error.message)}</p></div>`;return}
  jobs=r.data||[];paintJobs();
}
function clean(o){const x={};JF.forEach(([k])=>{let v=o[k];if(v===undefined||v===null||v==="")return;if(k==="stage")v=Array.isArray(v)?v:String(v).split(",").map(t=>t.trim()).filter(Boolean);x[k]=v});if(!x.seen)x.seen=new Date().toISOString().slice(0,10);return x}
function paintJobs(){
  const live=jobs.filter(j=>j.active).length;
  const rows=jobs.filter(j=>!jq||(j.title+" "+j.company+" "+j.city).toLowerCase().includes(jq));
  main.innerHTML=`
  <div><div class="eyebrow">Careers tab</div><h1>Jobs board</h1><p class="muted" style="margin-top:4px">${live} live · ${jobs.length-live} hidden. Hide a job when it closes; it disappears from the site straight away.</p></div>
  ${jmsg?`<p class="msg" style="background:var(--accent-soft);color:var(--ink)">${esc(jmsg)}</p>`:""}
  <details class="card"><summary style="cursor:pointer;font-weight:600">Add a job</summary>

  <div class="an-grid">
    <div class="card"><div class="row sp" style="margin-bottom:10px"><h2>Time by section</h2><span class="muted" style="font-size:.8rem">share of study time</span></div>
      ${secRows.length?secRows.map(([k,x])=>`<div class="an-bar" title="${esc(SECN[k]||k)}: ${hrs(x.s)}, ${x.u.size} students"><span class="an-l">${esc(SECN[k]||k)}</span><span class="an-v num">${hrs(x.s)} <span class="muted">· ${Math.round(x.s/Math.max(1,total)*100)}%</span></span><div class="an-t"><i style="width:${x.s/mxS*100}%"></i></div><span class="an-s muted">${x.u.size} student${x.u.size===1?"":"s"} · ${Math.round(x.s/x.u.size/60)} min each</span></div>`).join(""):`<p class="muted">No data yet.</p>`}</div>
    <div class="card"><div class="row sp" style="margin-bottom:10px"><h2>Key actions</h2><span class="muted" style="font-size:.8rem">count · students</span></div>
      <table><tbody>${Object.keys(ACTN).map(k=>{const x=act[k];return `<tr><td>${ACTN[k]}</td><td class="num" style="text-align:right"><b>${x?x.h:0}</b></td><td class="num muted" style="text-align:right">${x?x.u.size:0}</td></tr>`}).join("")}</tbody></table>
      <h2 style="margin:16px 0 8px">Time by level</h2>${Object.entries(lvl).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="an-bar"><span class="an-l">${LV[k]||k}</span><span class="an-v num">${hrs(v)}</span><div class="an-t"><i style="width:${v/Math.max(1,total)*100}%"></i></div></div>`).join("")||`<p class="muted">No data yet.</p>`}</div>
  </div>
  <div class="card"><div class="row sp" style="margin-bottom:10px"><h2>When students study</h2><span class="muted" style="font-size:.8rem">your local time · darker = more time</span></div>
    <div class="an-heat"><span></span>${[...Array(24)].map((_,h)=>`<span class="an-hx">${h%3===0?h:""}</span>`).join("")}${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<span class="an-hy">${d}</span>${heat[i].map((v,h)=>`<i title="${d} ${String(h).padStart(2,"0")}:00 · ${hrs(v)}" style="background:${v?`color-mix(in srgb,var(--heat) ${Math.round(12+v/mxH*88)}%,var(--surface-2))`:"var(--surface-2)"}"></i>`).join("")}`).join("")}</div></div>
  <div class="row sp"><h2>Students by time spent</h2><span class="muted" style="font-size:.8rem">tap a row for their section breakdown</span></div>
  <div class="tbl"><table><thead><tr><th>Student</th><th>Level</th><th style="text-align:right">Time</th><th style="text-align:right">Active days</th><th>Most time on</th><th>Last active</th></tr></thead><tbody>
  ${top.length?top.map(([id,x])=>{const pr=P[id]||{};const fav=Object.entries(x.sec).sort((a,b)=>b[1]-a[1])[0];const open=anOpen===id;
    return `<tr class="an-row" data-au="${id}" style="cursor:pointer"><td>${esc(pr.name)||'<span class="muted">—</span>'}<span class="muted" style="display:block;font-size:.78rem">${esc(pr.email||(pr.is_guest?"Visitor":""))}</span></td><td>${esc(LV[pr.level]||"—")}</td><td class="num" style="text-align:right"><b>${hrs(x.s)}</b></td><td class="num" style="text-align:right">${x.days.size}</td><td>${esc(SECN[fav[0]]||fav[0])}</td><td class="num">${new Date(x.last).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</td></tr>
    ${open?`<tr><td colspan="6" style="white-space:normal;background:var(--surface-2)">${Object.entries(x.sec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="an-bar"><span class="an-l">${esc(SECN[k]||k)}</span><span class="an-v num">${hrs(v)}</span><div class="an-t"><i style="width:${v/x.s*100}%"></i></div></div>`).join("")}</td></tr>`:""}`}).join(""):`<tr><td colspan="6" class="muted">No activity yet.</td></tr>`}
  </tbody></table></div>
  <p class="muted" style="font-size:.8rem">Time counts only while a student is actively using the site (page open and used in the last 2 minutes). Mock exams and videos count for as long as they're open.</p>`;
  document.querySelectorAll("[data-an]").forEach(b=>b.onclick=()=>{anRange=+b.dataset.an;main.innerHTML=`<p class="muted">Loading…</p>`;loadAnalytics()});
  document.getElementById("anV").onchange=e=>{anVisitors=e.target.checked;paintAnalytics()};
  document.querySelectorAll("[data-au]").forEach(r=>r.onclick=()=>{anOpen=anOpen===r.dataset.au?null:r.dataset.au;paintAnalytics()});
}

start();
})();
</script>
</body>
</html>
