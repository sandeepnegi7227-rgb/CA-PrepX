<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA PrepX Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7EF; --surface:#FFFFFF; --surface-2:#F3EEE1; --ink:#141414; --muted:#6B6558;
  --line:#E6DFCC; --accent:#111111; --accent-ink:#E0B43A; --accent-soft:#F6EDD2;
  --tick:#C2410C; --tick-soft:#FBE4D8; --warn:#C8961E; --warn-soft:#F6EBCB;
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;
  --bg:#0B0B0C; --surface:#161617; --surface-2:#1F1F22; --ink:#F3EEDF; --muted:#A39C88;
  --line:#2C2921; --accent:#E0B43A; --accent-ink:#1A1405; --accent-soft:#2A2414;
  --tick:#F2845C; --tick-soft:#3A2016; --warn:#8A7A55; --warn-soft:#33290F;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:1.8rem} h2{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--serif);font-size:1.2rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.88rem;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
main{display:grid;gap:20px;padding-block:8px 60px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:760px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin-top:4px}
.stat .s{font-size:.8rem;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line);padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.col .e{background:var(--accent);border-radius:2px 2px 0 0}
.col .g{background:var(--warn)}
.col .e+.g{border-radius:0}
.col .g:first-child{border-radius:2px 2px 0 0}
.xl{display:flex;gap:3px;font-size:.66rem;color:var(--muted);font-family:var(--mono);margin-top:4px}
.xl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.pill.g{background:var(--warn-soft);color:var(--ink)}
input[type=search],input[type=email],input[type=password]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.login{max-width:380px;margin:40px auto;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.msg{font-size:.88rem;padding:9px 12px;border-radius:8px;background:var(--tick-soft);color:var(--tick)}
</style>
</head>
<body>
<header class="wrap top">
  <div class="brand">
    <img src="/logo-180.png" alt="CA PrepX logo" width="34" height="34" style="border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line)">
    <div><b>CA PrepX</b> <span class="muted">· Admin</span></div>
  </div>
  <div class="row" id="topAct"></div>
</header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
(function(){
const CFG=window.PREPX_CONFIG||{};
const main=document.getElementById("main"),top=document.getElementById("topAct");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!CFG.url||!CFG.anonKey||!window.supabase){main.innerHTML=`<div class="card"><h2>Not connected yet</h2><p class="muted" style="margin-top:6px">Add your Supabase URL and key to <b>config.js</b>, then reload.</p></div>`;return}
const sb=window.supabase.createClient(CFG.url,CFG.anonKey);
let profiles=[],logins=[],filter="all",q="",view="students",jobs=[],jq="",jmsg="",papersA=[],qcount={},vidsA=[],chansA=[],vq="",vlv="all",amsg="";
const LV={foundation:"Foundation",inter:"Intermediate",final:"Final"};
const d2=d=>new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};

function loginForm(err){
  top.innerHTML=`<a class="btn" href="/">Open site</a>`;
  main.innerHTML=`<div class="card login"><h1>Admin sign in</h1>${err?`<p class="msg">${esc(err)}</p>`:""}
   <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
   <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
   <button class="btn primary" id="go">Sign in</button></div>`;
  const go=async()=>{const b=document.getElementById("go");b.disabled=true;b.textContent="Signing in…";
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value});
    if(error)return loginForm(error.message);start()};
  document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function start(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return loginForm();
  const r=await sb.rpc("is_admin");
  if(!r.data){top.innerHTML=`<button class="btn" id="so">Sign out</button>`;document.getElementById("so").onclick=async()=>{await sb.auth.signOut();loginForm()};
    main.innerHTML=`<div class="card"><h2>This account isn't an admin</h2><p class="muted" style="margin-top:6px">Signed in as ${esc(data.session.user.email||"a guest")}. Run the "make yourself admin" line in supabase-setup.sql for your account, then reload.</p></div>`;return}
  top.innerHTML=`<div class="seg" id="vw"><button data-v="students" aria-pressed="true">Students</button><button data-v="jobs" aria-pressed="false">Jobs</button><button data-v="papers" aria-pressed="false">Mock papers</button><button data-v="videos" aria-pressed="false">Videos</button></div><a class="btn" href="/">Open site</a><button class="btn" id="rf">Refresh</button><button class="btn" id="so">Sign out</button>`;
  document.querySelectorAll("#vw [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("#vw [data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));load()});
  document.getElementById("rf").onclick=load;document.getElementById("so").onclick=async()=>{await sb.auth.signOut();loginForm()};
  load();
}
async function load(){
  main.innerHTML=`<p class="muted">Loading…</p>`;
  if(view==="jobs")return loadJobs();
  if(view==="papers")return loadPapersA();
  if(view==="videos")return loadVideosA();
  const since=new Date(Date.now()-29*864e5);since.setHours(0,0,0,0);
  const [p,l]=await Promise.all([
    sb.from("profiles").select("*").order("last_login",{ascending:false,nullsFirst:false}).limit(5000),
    sb.from("logins").select("user_id,is_guest,at").gte("at",since.toISOString()).order("at",{ascending:false}).limit(20000)
  ]);
  if(p.error||l.error){main.innerHTML=`<div class="card"><p class="msg">${esc((p.error||l.error).message)}</p></div>`;return}
  profiles=p.data||[];logins=l.data||[];paint();
}
function paint(){
  const now=new Date(),today=dayKey(now);
  const emails=profiles.filter(x=>!x.is_guest).length,guests=profiles.length-emails;
  const totalLogins=profiles.reduce((a,x)=>a+(x.login_count||0),0);
  const todayUsers=new Set(logins.filter(x=>dayKey(x.at)===today).map(x=>x.user_id)).size;
  const wk=Date.now()-7*864e5;const wkLogins=logins.filter(x=>new Date(x.at)>=wk).length;
  const newWk=profiles.filter(x=>new Date(x.created_at)>=wk).length;
  // chart: 30 days
  const days=[];for(let i=29;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push({d,k:dayKey(d),e:0,g:0})}
  const idx={};days.forEach((x,i)=>idx[x.k]=i);
  logins.forEach(x=>{const i=idx[dayKey(x.at)];if(i!==undefined)x.is_guest?days[i].g++:days[i].e++});
  const mx=Math.max(4,...days.map(x=>x.e+x.g));
  const rows=profiles.filter(x=>(filter==="all"||(filter==="guest")===!!x.is_guest)&&(!q||((x.email||"")+" "+(x.name||"")).toLowerCase().includes(q)));
  main.innerHTML=`
  <div><div class="eyebrow">Updated ${d2(now)}</div><h1>Who's using CA PrepX</h1></div>
  <div class="stats">
    <div class="stat"><div class="eyebrow">Students</div><div class="v">${profiles.length}</div><div class="s">${emails} with account · ${guests} visitors</div></div>
    <div class="stat"><div class="eyebrow">Total logins</div><div class="v">${totalLogins}</div><div class="s">all time</div></div>
    <div class="stat"><div class="eyebrow">Active today</div><div class="v">${todayUsers}</div><div class="s">students</div></div>
    <div class="stat"><div class="eyebrow">Logins · 7 days</div><div class="v">${wkLogins}</div><div class="s">sign-ins and visits</div></div>
    <div class="stat"><div class="eyebrow">New · 7 days</div><div class="v">${newWk}</div><div class="s">students joined</div></div>
  </div>
  <div class="card"><div class="row sp" style="margin-bottom:12px"><h2>Logins per day</h2><div class="legend"><span><i style="background:var(--accent)"></i>Email</span><span><i style="background:var(--warn)"></i>Visitor</span></div></div>
    <div class="chart">${days.map(x=>`<div class="col" title="${x.d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}: ${x.e} email, ${x.g} guest">${x.g?`<div class="g" style="height:${x.g/mx*100}%"></div>`:""}${x.e?`<div class="e" style="height:${x.e/mx*100}%"></div>`:""}</div>`).join("")}</div>
    <div class="xl">${days.map((x,i)=>`<span>${i%5===4||i===29?x.d.getDate()+" "+x.d.toLocaleDateString("en-GB",{month:"short"}):""}</span>`).join("")}</div>
    <p class="muted" style="font-size:.8rem;margin-top:8px">Last 30 days. Peak: ${Math.max(...days.map(x=>x.e+x.g))} logins in a day.</p></div>
  <div class="row sp"><h2>Students</h2><div class="row"><input type="search" id="q" placeholder="Search name or email" value="${esc(q)}"><div class="seg">${[["all","All"],["email","Accounts"],["guest","Visitors"]].map(f=>`<button data-f="${f[0]}" aria-pressed="${filter===f[0]}">${f[1]}</button>`).join("")}</div></div></div>
  <div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Type</th><th>Level</th><th style="text-align:right">Logins</th><th>Last login</th><th>Joined</th></tr></thead><tbody>
  ${rows.length?rows.map(x=>`<tr><td>${esc(x.name)||'<span class="muted">—</span>'}</td><td>${x.email?esc(x.email):'<span class="muted">—</span>'}</td><td><span class="pill ${x.is_guest?"g":""}">${x.is_guest?"Visitor":"Account"}</span></td><td>${esc(LV[x.level]||x.level||"—")}</td><td class="num" style="text-align:right">${x.login_count||0}</td><td class="num">${x.last_login?d2(x.last_login):"—"}</td><td class="num">${d2(x.created_at)}</td></tr>`).join(""):`<tr><td colspan="7" class="muted">No students match.</td></tr>`}
  </tbody></table></div>
  <p class="muted" style="font-size:.8rem">Visitors are people using the site without an account (counted once per visit). Accounts are students who signed up with email.</p>`;
  const qi=document.getElementById("q");qi.oninput=()=>{q=qi.value.trim().toLowerCase();const pos=qi.selectionStart;paint();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;paint()});
}
const JF=[["title","Job title",1],["company","Company",1],["short","Short name for LinkedIn search (e.g. EY)",0],["type","Employer type (Big 4, Mid-tier firm, Corporate, GCC / MNC, Bank / NBFC, Investment bank, Fintech)",0],["domain","Area: audit, ia, dt, gst, fpa, ctrl, ta, cons, forensic, ib, articleship",1],["city","City: delhi, mumbai, bengaluru, pune, hyderabad, dubai, india",1],["location","Location shown (e.g. Gurugram, Haryana)",0],["stage","Level: student, fresher, exp (comma-separated)",1],["exp","Experience / eligibility",0],["apply","Apply link",1],["careers","Company careers page (optional)",0],["email","Official recruitment email (optional)",0],["seen","Date seen (YYYY-MM-DD)",0]];
async function loadJobs(){
  const r=await sb.from("jobs").select("*").order("seen",{ascending:false}).limit(2000);
  if(r.error){main.innerHTML=`<div class="card"><h2>Jobs table not set up</h2><p class="muted" style="margin-top:6px">Run <b>jobs-setup.sql</b> in Supabase → SQL Editor, then click Refresh.</p><p class="msg" style="margin-top:10px">${esc(r.error.message)}</p></div>`;return}
  jobs=r.data||[];paintJobs();
}
function clean(o){const x={};JF.forEach(([k])=>{let v=o[k];if(v===undefined||v===null||v==="")return;if(k==="stage")v=Array.isArray(v)?v:String(v).split(",").map(t=>t.trim()).filter(Boolean);x[k]=v});if(!x.seen)x.seen=new Date().toISOString().slice(0,10);return x}
function paintJobs(){
  const live=jobs.filter(j=>j.active).length;
  const rows=jobs.filter(j=>!jq||(j.title+" "+j.company+" "+j.city).toLowerCase().includes(jq));
  main.innerHTML=`
  <div><div class="eyebrow">Careers tab</div><h1>Jobs board</h1><p class="muted" style="margin-top:4px">${live} live · ${jobs.length-live} hidden. Hide a job when it closes; it disappears from the site straight away.</p></div>
  ${jmsg?`<p class="msg" style="background:var(--accent-soft);color:var(--ink)">${esc(jmsg)}</p>`:""}
  <details class="card"><summary style="cursor:pointer;font-weight:600">Add a job</summary>
    <div style="display:grid;gap:10px;margin-top:12px">${JF.map(([k,l,req])=>`<div class="field"><label for="f_${k}">${esc(l)}${req?" *":""}</label><input id="f_${k}" type="text" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px" ${k==="seen"?`value="${new Date().toISOString().slice(0,10)}"`:""}></div>`).join("")}
    <div><button class="btn primary" id="addJob">Add job</button></div></div></details>
  <details class="card"><summary style="cursor:pointer;font-weight:600">Import many (paste JSON)</summary>
    <p class="muted" style="font-size:.85rem;margin-top:8px">Paste a list of jobs in JSON (for example, the weekly update Claude prepares for you). Fields: ${JF.map(f=>f[0]).join(", ")}.</p>
    <textarea id="bulk" rows="7" style="width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;font-size:.85rem"></textarea>
    <div class="row" style="margin-top:8px"><label style="font-size:.85rem"><input type="checkbox" id="bulkHide"> Hide all current jobs first</label><button class="btn primary" id="doBulk">Import</button></div></details>
  <div class="row sp"><h2>All jobs</h2><input type="search" id="jq" placeholder="Search jobs" value="${esc(jq)}"></div>
  <div class="tbl"><table><thead><tr><th>Seen</th><th>Title</th><th>Company</th><th>City</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(j=>`<tr><td class="num">${esc(j.seen)}</td><td style="white-space:normal;min-width:220px"><a href="${esc(j.apply)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(j.title)}</a></td><td>${esc(j.company)}</td><td>${esc(j.city)}</td><td><span class="pill ${j.active?"":"g"}">${j.active?"Live":"Hidden"}</span></td><td><div class="row"><button class="btn" data-tog="${j.id}">${j.active?"Hide":"Show"}</button><button class="btn" data-del="${j.id}">Delete</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="muted">No jobs yet.</td></tr>`}
  </tbody></table></div>`;
  const qi=document.getElementById("jq");qi.oninput=()=>{jq=qi.value.trim().toLowerCase();const pos=qi.selectionStart;paintJobs();const n=document.getElementById("jq");n.focus();n.setSelectionRange(pos,pos)};
  document.getElementById("addJob").onclick=async()=>{const o={};JF.forEach(([k])=>o[k]=document.getElementById("f_"+k).value.trim());const miss=JF.filter(f=>f[2]&&!o[f[0]]).map(f=>f[0]);if(miss.length){jmsg="Please fill: "+miss.join(", ");return paintJobs()}
    const r=await sb.from("jobs").insert(clean(o));jmsg=r.error?"Couldn't add: "+r.error.message:"Job added.";loadJobs()};
  document.getElementById("doBulk").onclick=async()=>{let arr;try{arr=JSON.parse(document.getElementById("bulk").value)}catch(e){jmsg="That isn't valid JSON.";return paintJobs()}
    if(!Array.isArray(arr)||!arr.length){jmsg="Paste a list of jobs.";return paintJobs()}
    if(document.getElementById("bulkHide").checked){const h=await sb.from("jobs").update({active:false}).eq("active",true);if(h.error){jmsg=h.error.message;return paintJobs()}}
    const r=await sb.from("jobs").insert(arr.map(clean));jmsg=r.error?"Import failed: "+r.error.message:`Imported ${arr.length} jobs.`;loadJobs()};
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=async()=>{const j=jobs.find(x=>String(x.id)===b.dataset.tog);const r=await sb.from("jobs").update({active:!j.active}).eq("id",j.id);jmsg=r.error?r.error.message:"";loadJobs()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Sure?";return}const r=await sb.from("jobs").delete().eq("id",b.dataset.del);jmsg=r.error?r.error.message:"Deleted.";loadJobs()});
}
const inp='style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px"';
async function loadPapersA(){const r=await sb.from("mpapers").select("*").order("adate",{ascending:false}).limit(3000);
  if(r.error){main.innerHTML=`<div class="card"><h2>Mock tests not set up</h2><p class="muted" style="margin-top:6px">Run <b>setup-mock-videos.sql</b> in Supabase → SQL Editor, then click Refresh.</p><p class="msg" style="margin-top:10px">${esc(r.error.message)}</p></div>`;return}
  papersA=r.data||[];const c=await sb.from("mquestions").select("paper").limit(100000);qcount={};(c.data||[]).forEach(x=>qcount[x.paper]=(qcount[x.paper]||0)+1);paintPapersA()}
function paintPapersA(){
  main.innerHTML=`<div><div class="eyebrow">Practice tab</div><h1>Mock papers</h1><p class="muted" style="margin-top:4px">${papersA.length} papers · ${Object.values(qcount).reduce((a,b)=>a+b,0)} questions. Upload a paper file Claude prepares for you, or hide a paper to take it off the site.</p></div>
  ${amsg?`<p class="msg" style="background:var(--accent-soft);color:var(--ink)">${esc(amsg)}</p>`:""}
  <div class="card"><h2>Upload papers (JSON)</h2><p class="muted" style="font-size:.85rem;margin-top:6px">Choose the .json file(s) Claude sends you. Re-uploading the same paper updates it.</p>
    <div class="row" style="margin-top:10px"><input type="file" id="pf" accept=".json,application/json" multiple><button class="btn primary" id="pup">Upload</button></div></div>
  <div class="card"><h2>Add an ICAI file (e.g. an MTP)</h2><p class="muted" style="font-size:.85rem;margin-top:6px">Paste the link of an ICAI PDF from the BoS portal. It appears in the Exam hall straight away. Add the answers PDF as a separate row (source ending in "answers").</p>
    <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px">
      <select id="dL" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><option value="final">Final</option><option value="inter">Intermediate</option><option value="foundation">Foundation</option></select>
      <input id="dP" placeholder="Paper code, e.g. N1, I3, F2" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">
      <input id="dA" placeholder="Attempt, e.g. November 2026" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">
      <input id="dD" placeholder="Sort date, e.g. 2026-11" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">
      <select id="dS" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><option value="mtp1">MTP Series I (questions)</option><option value="mtp1_ans">MTP Series I (answers)</option><option value="mtp2">MTP Series II (questions)</option><option value="mtp2_ans">MTP Series II (answers)</option><option value="pyq">Past paper (questions)</option><option value="pyq_ans">Past paper (answers)</option><option value="rtp">RTP</option></select>
    </div>
    <input id="dU" placeholder="https://resource.cdn.icai.org/....pdf" style="width:100%;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px">
    <div class="row" style="margin-top:10px"><button class="btn primary" id="dAdd">Add file</button></div></div>
  <div class="tbl"><table><thead><tr><th>Attempt</th><th>Paper</th><th>Source</th><th>Questions</th><th>Status</th><th></th></tr></thead><tbody>
  ${papersA.length?papersA.map(p=>`<tr><td>${esc(p.attempt)}</td><td style="white-space:normal">${esc(p.title||p.pid)}<span class="muted" style="display:block;font-size:.78rem">${esc(p.id)}</span></td><td>${esc(p.source)}</td><td class="num">${qcount[p.id]||0}</td><td><span class="pill ${p.active?"":"g"}">${p.active?"Live":"Hidden"}</span></td><td><div class="row"><button class="btn" data-ptog="${esc(p.id)}">${p.active?"Hide":"Show"}</button><button class="btn" data-pdel="${esc(p.id)}">Delete</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="muted">No papers yet.</td></tr>`}</tbody></table></div>`;
  document.getElementById("dAdd").onclick=async()=>{const g=id=>document.getElementById(id).value.trim();const row={level:g("dL"),pid:g("dP").toUpperCase(),attempt:g("dA"),adate:g("dD"),source:g("dS"),url:g("dU")};
    if(!/^[FIN][1-6]$/.test(row.pid)||!row.attempt||!/^\d{4}-\d{2}$/.test(row.adate)||!/^https:\/\/.+\.pdf$/i.test(row.url)){amsg="Fill all fields: paper code like N1, attempt, date like 2026-11 and a https link ending in .pdf.";return paintPapersA()}
    const r=await sb.from("icai_docs").insert(row);amsg=r.error?"Couldn't add: "+r.error.message:"Added. It shows in the Exam hall now.";paintPapersA()};
  document.getElementById("pup").onclick=async()=>{const files=[...document.getElementById("pf").files];if(!files.length){amsg="Choose a file first.";return paintPapersA()}
    let n=0,qn=0;for(const f of files){let d;try{d=JSON.parse(await f.text())}catch(e){amsg=`${f.name} isn't valid JSON.`;return paintPapersA()}
      for(const item of (Array.isArray(d)?d:[d])){const {paper,questions}=item;if(!paper||!paper.id){amsg=`${f.name}: missing paper details.`;return paintPapersA()}
        const r1=await sb.from("mpapers").upsert(paper);if(r1.error){amsg=`${f.name}: ${r1.error.message}`;return paintPapersA()}
        await sb.from("mquestions").delete().eq("paper",paper.id);
        const qs=(questions||[]).map((q,i)=>({ord:i,level:paper.level,pid:paper.pid,...q,paper:paper.id}));
        for(let i=0;i<qs.length;i+=200){const r2=await sb.from("mquestions").insert(qs.slice(i,i+200));if(r2.error){amsg=`${f.name}: ${r2.error.message}`;return paintPapersA()}}
        n++;qn+=qs.length}}
    amsg=`Uploaded ${n} paper${n>1?"s":""} with ${qn} questions.`;loadPapersA()};
  document.querySelectorAll("[data-ptog]").forEach(b=>b.onclick=async()=>{const p=papersA.find(x=>x.id===b.dataset.ptog);const r=await sb.from("mpapers").update({active:!p.active}).eq("id",p.id);amsg=r.error?r.error.message:"";loadPapersA()});
  document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Sure?";return}const r=await sb.from("mpapers").delete().eq("id",b.dataset.pdel);amsg=r.error?r.error.message:"Deleted.";loadPapersA()});
}
async function loadVideosA(){let qy=sb.from("videos").select("*").order("created_at",{ascending:false}).limit(300);if(vlv!=="all")qy=qy.eq("level",vlv);if(vq)qy=qy.or(`title.ilike.%${vq.replace(/[%,()]/g," ")}%,teacher.ilike.%${vq.replace(/[%,()]/g," ")}%`);
  const [r,c,n]=await Promise.all([qy,sb.from("vchannels").select("*").order("channel"),sb.from("videos").select("yt",{count:"exact",head:true})]);
  if(r.error){main.innerHTML=`<div class="card"><h2>Videos not set up</h2><p class="muted" style="margin-top:6px">Run <b>setup-mock-videos.sql</b> in Supabase → SQL Editor, then click Refresh.</p><p class="msg" style="margin-top:10px">${esc(r.error.message)}</p></div>`;return}
  vidsA=r.data||[];chansA=c.data||[];paintVideosA(n.count||0)}
function paintVideosA(total){
  main.innerHTML=`<div><div class="eyebrow">Resources tab</div><h1>Videos</h1><p class="muted" style="margin-top:4px">${total} videos in the library. They refresh automatically every day. Pin the best ones to the top, hide weak ones, and boost or block teachers.</p></div>
  ${amsg?`<p class="msg" style="background:var(--accent-soft);color:var(--ink)">${esc(amsg)}</p>`:""}
  <div class="card"><h2>Teachers</h2><p class="muted" style="font-size:.85rem;margin-top:6px">Type the channel name exactly as on YouTube. Boosted teachers rank higher; blocked channels never appear.</p>
    <div class="row" style="margin-top:10px"><input id="chn" placeholder="Channel name" ${inp}><select id="chs" ${inp}><option value="boost">Boost</option><option value="block">Block</option></select><button class="btn primary" id="chadd">Save</button></div>
    <div class="row" style="margin-top:10px">${chansA.map(c=>`<span class="pill ${c.status==="block"?"g":""}">${esc(c.channel)} · ${c.status} <button class="btn" style="padding:0 6px;border:0;background:none" data-chdel="${esc(c.channel)}" aria-label="Remove">×</button></span>`).join("")||`<span class="muted">No teachers boosted or blocked yet.</span>`}</div></div>
  <div class="row sp"><h2>Latest videos</h2><div class="row"><select id="vlv" ${inp}>${[["all","All levels"],["foundation","Foundation"],["inter","Inter"],["final","Final"]].map(x=>`<option value="${x[0]}" ${vlv===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><input type="search" id="vq" placeholder="Search title or teacher" value="${esc(vq)}"></div></div>
  <div class="tbl"><table><thead><tr><th></th><th>Title</th><th>Teacher</th><th>Paper · Ch</th><th>Views</th><th></th></tr></thead><tbody>
  ${vidsA.length?vidsA.map(v=>`<tr><td><img src="https://i.ytimg.com/vi/${encodeURIComponent(v.yt)}/default.jpg" width="64" height="48" style="border-radius:6px;object-fit:cover" alt=""></td><td style="white-space:normal;min-width:240px"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(v.yt)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(v.title)}</a></td><td>${esc(v.teacher)}</td><td>${esc(v.pid)} · ${v.ch!=null?v.ch+1:"—"}</td><td class="num">${(v.views||0).toLocaleString("en-IN")}</td><td><div class="row"><button class="btn" data-vpin="${esc(v.yt)}">${v.pinned?"Unpin":"Pin"}</button><button class="btn" data-vtog="${esc(v.yt)}">${v.active?"Hide":"Show"}</button><button class="btn" data-vblock="${esc(v.teacher)}">Block teacher</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="muted">No videos yet. They appear after the first daily refresh runs.</td></tr>`}</tbody></table></div>`;
  document.getElementById("chadd").onclick=async()=>{const n=document.getElementById("chn").value.trim();if(!n)return;const r=await sb.from("vchannels").upsert({channel:n,status:document.getElementById("chs").value});amsg=r.error?r.error.message:"Saved.";loadVideosA()};
  document.querySelectorAll("[data-chdel]").forEach(b=>b.onclick=async()=>{await sb.from("vchannels").delete().eq("channel",b.dataset.chdel);loadVideosA()});
  document.querySelectorAll("[data-vpin]").forEach(b=>b.onclick=async()=>{const v=vidsA.find(x=>x.yt===b.dataset.vpin);await sb.from("videos").update({pinned:!v.pinned}).eq("yt",v.yt);loadVideosA()});
  document.querySelectorAll("[data-vtog]").forEach(b=>b.onclick=async()=>{const v=vidsA.find(x=>x.yt===b.dataset.vtog);await sb.from("videos").update({active:!v.active}).eq("yt",v.yt);loadVideosA()});
  document.querySelectorAll("[data-vblock]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Sure?";return}const t=b.dataset.vblock;await sb.from("vchannels").upsert({channel:t,status:"block"});await sb.from("videos").update({active:false}).eq("teacher",t);amsg=`Blocked ${t}; their videos are hidden.`;loadVideosA()});
  document.getElementById("vlv").onchange=e=>{vlv=e.target.value;loadVideosA()};
  let tmo;document.getElementById("vq").oninput=e=>{clearTimeout(tmo);tmo=setTimeout(()=>{vq=e.target.value.trim();loadVideosA().then(()=>{const n=document.getElementById("vq");n.focus();n.setSelectionRange(n.value.length,n.value.length)})},350)};
}
start();
})();
</script>
</body>
</html>
