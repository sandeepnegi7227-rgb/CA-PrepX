<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA PrepX Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7EF; --surface:#FFFFFF; --surface-2:#F3EEE1; --ink:#141414; --muted:#6B6558;
  --line:#E6DFCC; --accent:#111111; --accent-ink:#E0B43A; --accent-soft:#F6EDD2;
  --tick:#C2410C; --tick-soft:#FBE4D8; --warn:#C8961E; --warn-soft:#F6EBCB;
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;
  --bg:#0B0B0C; --surface:#161617; --surface-2:#1F1F22; --ink:#F3EEDF; --muted:#A39C88;
  --line:#2C2921; --accent:#E0B43A; --accent-ink:#1A1405; --accent-soft:#2A2414;
  --tick:#F2845C; --tick-soft:#3A2016; --warn:#8A7A55; --warn-soft:#33290F;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:1.8rem} h2{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--serif);font-size:1.2rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.88rem;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
main{display:grid;gap:20px;padding-block:8px 60px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:760px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin-top:4px}
.stat .s{font-size:.8rem;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line);padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.col .e{background:var(--accent);border-radius:2px 2px 0 0}
.col .g{background:var(--warn)}
.col .e+.g{border-radius:0}
.col .g:first-child{border-radius:2px 2px 0 0}
.xl{display:flex;gap:3px;font-size:.66rem;color:var(--muted);font-family:var(--mono);margin-top:4px}
.xl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.pill.g{background:var(--warn-soft);color:var(--ink)}
input[type=search],input[type=email],input[type=password]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.login{max-width:380px;margin:40px auto;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.msg{font-size:.88rem;padding:9px 12px;border-radius:8px;background:var(--tick-soft);color:var(--tick)}
.an-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.an-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.an-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;font-size:.88rem}
.an-t{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.an-t i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.an-s{grid-column:1/-1;font-size:.75rem}
.an-heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:3px;font-size:.68rem;color:var(--muted)}
.an-heat i{display:block;aspect-ratio:1;border-radius:3px;min-height:10px}
.an-hy{align-self:center}.an-hx{text-align:center}
.an-row:hover td{background:var(--surface-2)}
:root{--heat:#9C7400}
@media (prefers-color-scheme: dark){:root{--heat:#E0B43A}}
#topAct{min-width:0;max-width:100%}#vw{display:flex;max-width:100%;overflow-x:auto}#vw button{white-space:nowrap;flex:none}
#main>*,.an-grid>*,.row>*{min-width:0}.seg{max-width:100%;overflow-x:auto;flex-wrap:nowrap}.seg button{white-space:nowrap;flex:none}
</style>
</head>
<body>
<header class="wrap top">
  <div class="brand">
    <img src="/logo-180.png" alt="CA PrepX logo" width="34" height="34" style="border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line)">
    <div><b>CA PrepX</b> <span class="muted">· Admin</span></div>
  </div>
  <div class="row" id="topAct"></div>
</header>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
(function(){
const CFG=window.PREPX_CONFIG||{};
const main=document.getElementById("main"),top=document.getElementById("topAct");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!CFG.url||!CFG.anonKey||!window.supabase){main.innerHTML=`<div class="card"><h2>Not connected yet</h2><p class="muted" style="margin-top:6px">Add your Supabase URL and key to <b>config.js</b>, then reload.</p></div>`;return}
const sb=window.supabase.createClient(CFG.url,CFG.anonKey);
let profiles=[],logins=[],filter="all",q="",view="students",jobs=[],jq="",jmsg="",papersA=[],qcount={},vidsA=[],chansA=[],vq="",vlv="all",amsg="";
const LV={foundation:"Foundation",inter:"Intermediate",final:"Final"};
const d2=d=>new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};

function loginForm(err){
  top.innerHTML=`<a class="btn" href="/">Open site</a>`;
  main.innerHTML=`<div class="card login"><h1>Admin sign in</h1>${err?`<p class="msg">${esc(err)}</p>`:""}
   <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
   <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
   <button class="btn primary" id="go">Sign in</button></div>`;
  const go=async()=>{const b=document.getElementById("go");b.disabled=true;b.textContent="Signing in…";
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value});
    if(error)return loginForm(error.message);start()};
  document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function start(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return loginForm();
  const r=await sb.rpc("is_admin");
  if(!r.data){top.innerHTML=`<button class="btn" id="so">Sign out</button>`;document.getElementById("so").onclick=async()=>{await sb.auth.signOut();loginForm()};
    main.innerHTML=`<div class="card"><h2>This account isn't an admin</h2><p class="muted" style="margin-top:6px">Signed in as ${esc(data.session.user.email||"a guest")}. Run the "make yourself admin" line in supabase-setup.sql for your account, then reload.</p></div>`;return}
  top.innerHTML=`<div class="seg" id="vw"><button data-v="students" aria-pressed="true">Overview</button><button data-v="analytics" aria-pressed="false">Analytics</button><button data-v="jobs" aria-pressed="false">Jobs</button><button data-v="papers" aria-pressed="false">Mock papers</button><button data-v="videos" aria-pressed="false">Videos</button><button data-v="checkers" aria-pressed="false">Checkers</button></div><a class="btn" href="/">Open site</a><button class="btn" id="rf">Refresh</button><button class="btn" id="so">Sign out</button>`;
  document.querySelectorAll("#vw [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("#vw [data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));load()});
  document.getElementById("rf").onclick=load;document.getElementById("so").onclick=async()=>{await sb.auth.signOut();loginForm()};
  load();
}

/* ---------- Teacher checkers ---------- */
let cmsg="";
async function loadCheckers(){
  const [c,s]=await Promise.all([sb.from("checkers").select("*").order("added_at",{ascending:true}),sb.from("submissions").select("id,status,checker_id,created_at,checked_at").limit(5000)]);
  if(c.error){main.innerHTML=`<div class="card"><h2>Teacher checking isn't set up</h2><p class="muted" style="margin-top:6px">Run <b>teacher-check-setup.sql</b> in Supabase → SQL Editor, then click Refresh.</p><p class="msg" style="margin-top:8px">${esc(c.error.message)}</p></div>`;return}
  const C=c.data||[],S=s.data||[];const by=id=>S.filter(x=>x.checker_id===id);
  const wait=S.filter(x=>x.status==="submitted").length,rev=S.filter(x=>x.status==="in_review").length,done=S.filter(x=>x.status==="checked").length;
  main.innerHTML=`<div class="row sp"><div><div class="eyebrow">Teacher checking</div><h1>Checkers</h1></div><a class="btn" href="/checker">Open teacher portal</a></div>
  <div class="stats"><div class="stat"><div class="eyebrow">Teachers</div><div class="v">${C.length}</div><div class="s">with checker access</div></div>
   <div class="stat"><div class="eyebrow">Waiting</div><div class="v">${wait}</div><div class="s">answer sheets not picked up</div></div>
   <div class="stat"><div class="eyebrow">Being checked</div><div class="v">${rev}</div><div class="s">in progress</div></div>
   <div class="stat"><div class="eyebrow">Checked</div><div class="v">${done}</div><div class="s">all time</div></div>
   <div class="stat"><div class="eyebrow">Uploads</div><div class="v">${S.length}</div><div class="s">total</div></div></div>
  <div class="card"><h2>Add a teacher</h2><p class="muted" style="margin:4px 0 12px">They first create a normal account on caprepx.com with this email. Then add it here and they can sign in at <b>caprepx.com/checker</b>.</p>
   <div class="row"><input type="email" id="ce" placeholder="teacher@email.com" style="min-width:240px"><input type="search" id="cn" placeholder="Name shown to students (optional)" style="min-width:220px"><button class="btn primary" id="cadd">Add teacher</button></div>
   ${cmsg?`<p class="${cmsg.startsWith("!")?"msg":"muted"}" style="margin-top:8px">${esc(cmsg.replace(/^!/,""))}</p>`:""}</div>
  <div class="tbl"><table><thead><tr><th>Teacher</th><th>Email</th><th>Added</th><th style="text-align:right">Checked</th><th style="text-align:right">In progress</th><th></th></tr></thead><tbody>
  ${C.length?C.map(x=>`<tr><td>${esc(x.name||"—")}</td><td>${esc(x.email||"")}</td><td class="num">${new Date(x.added_at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</td><td class="num" style="text-align:right">${by(x.user_id).filter(z=>z.status==="checked").length}</td><td class="num" style="text-align:right">${by(x.user_id).filter(z=>z.status==="in_review").length}</td><td><button class="btn" data-crm="${x.user_id}">Remove</button></td></tr>`).join(""):`<tr><td colspan="6" class="muted">No teachers yet. Add one above.</td></tr>`}
  </tbody></table></div>`;
  document.getElementById("cadd").onclick=async()=>{const e=document.getElementById("ce").value.trim(),n=document.getElementById("cn").value.trim();if(!e){cmsg="!Enter the teacher's email.";return loadCheckers()}
    const r=await sb.rpc("add_checker",{p_email:e,p_name:n||null});cmsg=r.error?"!"+r.error.message:r.data==="not_found"?`!No account found for ${e}. Ask them to sign up on caprepx.com first, then add them again.`:`Added ${e}. They can sign in at caprepx.com/checker.`;loadCheckers()};
  document.querySelectorAll("[data-crm]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tap again to remove";return}const r=await sb.rpc("remove_checker",{p_user:b.dataset.crm});cmsg=r.error?"!"+r.error.message:"Removed.";loadCheckers()});
}
async function load(){
  main.innerHTML=`<p class="muted">Loading…</p>`;
  if(view==="analytics")return loadAnalytics();
  if(view==="jobs")return loadJobs();
  if(view==="papers")return loadPapersA();
  if(view==="videos")return loadVideosA();
  if(view==="checkers")return loadCheckers();
  const since=new Date(Date.now()-30*864e5);since.setHours(0,0,0,0);
  const [p,l,u]=await Promise.all([
    sb.from("profiles").select("*").order("last_login",{ascending:false,nullsFirst:false}).limit(5000),
    sb.from("logins").select("user_id,is_guest,at").gte("at",since.toISOString()).order("at",{ascending:false}).limit(20000),
    sb.from("usage").select("user_id,hour,section,secs,hits").gte("hour",since.toISOString()).limit(100000)
  ]);
  if(p.error||l.error){main.innerHTML=`<div class="card"><p class="msg">${esc((p.error||l.error).message)}</p></div>`;return}
  profiles=p.data||[];logins=l.data||[];usageRows=u.error?[]:(u.data||[]);paint();
}
/* ---------- Overview: who is here, who came back, who went quiet ---------- */
let usageRows=[],ovDay="today",ovWho="students",sortBy="seen";
const IST="Asia/Kolkata";
const istDay=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:IST});
const istTime=d=>new Date(d).toLocaleTimeString("en-GB",{timeZone:IST,hour:"2-digit",minute:"2-digit"});
const istDate=d=>new Date(d).toLocaleDateString("en-GB",{timeZone:IST,day:"numeric",month:"short"});
const ago=d=>{if(!d)return"never";const m=(Date.now()-new Date(d))/6e4;if(m<60)return Math.max(1,Math.round(m))+" min ago";if(m<1440)return Math.round(m/60)+" h ago";const dd=Math.round(m/1440);return dd===1?"yesterday":dd+" days ago"};
const mins=s=>s>=3600?(s/3600).toFixed(1)+" h":s>=60?Math.round(s/60)+" min":s>0?"under 1 min":"—";
function paint(){
  const now=new Date(),LV={foundation:"Foundation",inter:"Intermediate",final:"Final"};
  const internal=profiles.filter(x=>x.is_internal),inIds=new Set(internal.map(x=>x.id));
  const P=Object.fromEntries(profiles.map(x=>[x.id,x]));
  const acc=profiles.filter(x=>!x.is_internal&&!x.is_guest),vis=profiles.filter(x=>!x.is_internal&&x.is_guest);
  // activity per user per day (India time), from sign-ins and time on site
  const A={};const cell=(uid,k)=>{const U=A[uid]=A[uid]||{};return U[k]=U[k]||{visits:0,secs:0,first:null,last:null,sec:{}}};
  logins.forEach(x=>{if(inIds.has(x.user_id))return;const c=cell(x.user_id,istDay(x.at));c.visits++;if(!c.first||x.at<c.first)c.first=x.at;if(!c.last||x.at>c.last)c.last=x.at});
  usageRows.forEach(r=>{if(inIds.has(r.user_id)||!(r.secs>0)||ACTN[r.section])return;const c=cell(r.user_id,istDay(r.hour));c.secs+=r.secs;c.sec[r.section]=(c.sec[r.section]||0)+r.secs;if(!c.first||r.hour<c.first)c.first=r.hour;if(!c.last||r.hour>c.last)c.last=r.hour});
  const days=[];for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push({d,k:istDay(d),s:new Set(),v:new Set(),n:0})}
  const di=Object.fromEntries(days.map((x,i)=>[x.k,i]));
  Object.entries(A).forEach(([uid,U])=>{const g=P[uid]?P[uid].is_guest:true;Object.keys(U).forEach(k=>{if(di[k]!=null)(g?days[di[k]].v:days[di[k]].s).add(uid)})});
  acc.forEach(x=>{const i=di[istDay(x.created_at)];if(i!=null)days[i].n++});
  const tk=days[29].k,yk=days[28].k,wkKeys=new Set(days.slice(-7).map(x=>x.k));
  const seen=x=>{let t=x.last_login||null;const U=A[x.id];if(U)Object.values(U).forEach(c=>{if(c.last&&(!t||c.last>t))t=c.last});return t};
  const secs30=x=>Object.values(A[x.id]||{}).reduce((a,c)=>a+c.secs,0);
  const status=x=>{const t=seen(x),dd=t?(Date.now()-new Date(t))/864e5:999;if(dd<=7)return["Active","a"];
    if((x.login_count||0)<=1&&(!t||new Date(t)-new Date(x.created_at)<864e5))return["Never came back","n"];return dd<=30?["Quiet","q"]:["Gone","g"]};
  const activeOn=(list,keys)=>list.filter(x=>A[x.id]&&Object.keys(A[x.id]).some(k=>keys.has(k)));
  const sToday=activeOn(acc,new Set([tk])),vToday=activeOn(vis,new Set([tk])),sWeek=activeOn(acc,wkKeys),s30=activeOn(acc,new Set(days.map(x=>x.k)));
  const back=acc.filter(x=>(x.login_count||0)>=2).length,newWk=acc.filter(x=>Date.now()-new Date(x.created_at)<7*864e5).length;
  const secOn=(list,keys)=>list.reduce((a,x)=>a+Object.entries(A[x.id]||{}).reduce((b,[k,c])=>b+(keys.has(k)?c.secs:0),0),0);
  const phones=acc.filter(x=>x.phone).length,lvl=acc.filter(x=>x.level).length;
  // who was here
  const keys=ovDay==="today"?new Set([tk]):ovDay==="yesterday"?new Set([yk]):wkKeys;
  const here=activeOn(ovWho==="students"?acc:vis,keys).map(x=>{const cs=Object.entries(A[x.id]).filter(([k])=>keys.has(k)).map(e=>e[1]);const sec={};let first=null,last=null,visits=0,secs=0;
    cs.forEach(c=>{visits+=c.visits;secs+=c.secs;if(c.first&&(!first||c.first<first))first=c.first;if(c.last&&(!last||c.last>last))last=c.last;Object.entries(c.sec).forEach(([k,v])=>sec[k]=(sec[k]||0)+v)});
    return{x,first,last,visits,secs,days:cs.length,top:Object.entries(sec).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>SECN[e[0]]||e[0])}}).sort((a,b)=>(b.last||"")>(a.last||"")?1:-1);
  const dayLabel=ovDay==="today"?"today":ovDay==="yesterday"?"yesterday":"in the last 7 days";
  // students table
  const pool=filter==="internal"?internal:filter==="visitors"?vis:acc;
  let rows=pool.map(x=>({x,t:seen(x),st:status(x),s:secs30(x)})).filter(r=>(["all","internal","visitors"].includes(filter)||r.st[1]===filter)&&(!q||((r.x.email||"")+" "+(r.x.name||"")+" "+(r.x.phone||"")).toLowerCase().includes(q)));
  rows.sort(sortBy==="time"?(a,b)=>b.s-a.s:sortBy==="logins"?(a,b)=>(b.x.login_count||0)-(a.x.login_count||0):sortBy==="joined"?(a,b)=>new Date(b.x.created_at)-new Date(a.x.created_at):(a,b)=>new Date(b.t||0)-new Date(a.t||0));
  const shown=rows.slice(0,300),ph=[...new Set(rows.map(r=>r.x.phone).filter(Boolean))];
  const cnt={a:0,q:0,g:0,n:0};acc.forEach(x=>cnt[status(x)[1]]++);
  const mx=Math.max(4,...days.map(x=>x.s.size+x.v.size));
  const fun=[["Signed up",acc.length],["Logged in more than once",back],["Active in the last 30 days",s30.length],["Active in the last 7 days",sWeek.length],["Active today",sToday.length]];

  <div class="card"><h2>Teachers</h2><p class="muted" style="font-size:.85rem;margin-top:6px">Type the channel name exactly as on YouTube. Boosted teachers rank higher; blocked channels never appear.</p>
    <div class="row" style="margin-top:10px"><input id="chn" placeholder="Channel name" ${inp}><select id="chs" ${inp}><option value="boost">Boost</option><option value="block">Block</option></select><button class="btn primary" id="chadd">Save</button></div>
    <div class="row" style="margin-top:10px">${chansA.map(c=>`<span class="pill ${c.status==="block"?"g":""}">${esc(c.channel)} · ${c.status} <button class="btn" style="padding:0 6px;border:0;background:none" data-chdel="${esc(c.channel)}" aria-label="Remove">×</button></span>`).join("")||`<span class="muted">No teachers boosted or blocked yet.</span>`}</div></div>
  <div class="row sp"><h2>Latest videos</h2><div class="row"><select id="vlv" ${inp}>${[["all","All levels"],["foundation","Foundation"],["inter","Inter"],["final","Final"]].map(x=>`<option value="${x[0]}" ${vlv===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><input type="search" id="vq" placeholder="Search title or teacher" value="${esc(vq)}"></div></div>
  <div class="tbl"><table><thead><tr><th></th><th>Title</th><th>Teacher</th><th>Paper · Ch</th><th>Views</th><th></th></tr></thead><tbody>
  ${vidsA.length?vidsA.map(v=>`<tr><td><img src="https://i.ytimg.com/vi/${encodeURIComponent(v.yt)}/default.jpg" width="64" height="48" style="border-radius:6px;object-fit:cover" alt=""></td><td style="white-space:normal;min-width:240px"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(v.yt)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(v.title)}</a></td><td>${esc(v.teacher)}</td><td>${esc(v.pid)} · ${v.ch!=null?v.ch+1:"—"}</td><td class="num">${(v.views||0).toLocaleString("en-IN")}</td><td><div class="row"><button class="btn" data-vpin="${esc(v.yt)}">${v.pinned?"Unpin":"Pin"}</button><button class="btn" data-vtog="${esc(v.yt)}">${v.active?"Hide":"Show"}</button><button class="btn" data-vblock="${esc(v.teacher)}">Block teacher</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="muted">No videos yet. They appear after the first daily refresh runs.</td></tr>`}</tbody></table></div>`;
  document.getElementById("chadd").onclick=async()=>{const n=document.getElementById("chn").value.trim();if(!n)return;const r=await sb.from("vchannels").upsert({channel:n,status:document.getElementById("chs").value});amsg=r.error?r.error.message:"Saved.";loadVideosA()};
  document.querySelectorAll("[data-chdel]").forEach(b=>b.onclick=async()=>{await sb.from("vchannels").delete().eq("channel",b.dataset.chdel);loadVideosA()});
  document.querySelectorAll("[data-vpin]").forEach(b=>b.onclick=async()=>{const v=vidsA.find(x=>x.yt===b.dataset.vpin);await sb.from("videos").update({pinned:!v.pinned}).eq("yt",v.yt);loadVideosA()});
  document.querySelectorAll("[data-vtog]").forEach(b=>b.onclick=async()=>{const v=vidsA.find(x=>x.yt===b.dataset.vtog);await sb.from("videos").update({active:!v.active}).eq("yt",v.yt);loadVideosA()});
  document.querySelectorAll("[data-vblock]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Sure?";return}const t=b.dataset.vblock;await sb.from("vchannels").upsert({channel:t,status:"block"});await sb.from("videos").update({active:false}).eq("teacher",t);amsg=`Blocked ${t}; their videos are hidden.`;loadVideosA()});
  document.getElementById("vlv").onchange=e=>{vlv=e.target.value;loadVideosA()};
  let tmo;document.getElementById("vq").oninput=e=>{clearTimeout(tmo);tmo=setTimeout(()=>{vq=e.target.value.trim();loadVideosA().then(()=>{const n=document.getElementById("vq");n.focus();n.setSelectionRange(n.value.length,n.value.length)})},350)};
}

/* ---------- Analytics: time per section and key actions ---------- */
const SECN={home:"Home","resources.papers":"RTP · MTP library","resources.syllabus":"Syllabus tracker","resources.tips":"Exam tips","resources.videos":"Videos · browsing","video.watch":"Videos · watching","practice.mcq":"MCQ practice","practice.mock":"Mock tests · exam hall","exam":"Mock exam · writing","plan.study":"Study plan","plan.progress":"My progress","plan.journey":"CA journey","spom.overview":"SPOM overview","spom.syllabus":"SPOM syllabus","spom.mcq":"SPOM MCQs","spom.test":"SPOM test booking",careers:"Careers · jobs",about:"About us"};
const ACTN={"exam.start":"Mock exams started","exam.submit":"Mock exams submitted","rtp.start":"RTP practice started","rtp.finish":"RTPs finished","chapter.start":"Chapter tests started","mcq.answer":"MCQs answered","video.play":"Videos played","plan.build":"Study plans built","plan.download":"Plans downloaded (Word)","jobs.apply":"Job apply clicks","jobs.careers":"Company careers clicks","jobs.linkedin":"LinkedIn searches","guest.start":"Guest entries"};
let anRange=30,anVisitors=false,anData=null,anOpen=null;
const hrs=s=>{const h=s/3600;return h>=10?Math.round(h)+" h":h>=1?h.toFixed(1)+" h":Math.round(s/60)+" min"};
async function loadAnalytics(){const since=new Date(Date.now()-anRange*864e5);since.setMinutes(0,0,0);
  const [u,p]=await Promise.all([sb.from("usage").select("user_id,hour,section,secs,hits").gte("hour",since.toISOString()).limit(100000),sb.from("profiles").select("id,name,email,level,is_guest,is_internal,last_login").limit(10000)]);
  if(u.error){main.innerHTML=`<div class="card"><h2>Analytics not set up</h2><p class="muted" style="margin-top:6px">Run <b>analytics-setup.sql</b> in Supabase → SQL Editor, then click Refresh. Time starts counting from then.</p><p class="msg" style="margin-top:10px">${esc(u.error.message)}</p></div>`;return}
  anData={u:u.data||[],p:Object.fromEntries((p.data||[]).map(x=>[x.id,x]))};paintAnalytics()}
function paintAnalytics(){const P=anData.p;const U=anData.u.filter(r=>!(P[r.user_id]&&P[r.user_id].is_internal)&&(anVisitors||!(P[r.user_id]&&P[r.user_id].is_guest)));
  const dk=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
  const T=U.filter(r=>r.secs>0&&!ACTN[r.section]),A=U.filter(r=>r.hits>0);
  const total=T.reduce((a,r)=>a+r.secs,0);const users={},days=[],sec={},act={},heat=[...Array(7)].map(()=>Array(24).fill(0)),lvl={};
  for(let i=anRange-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push({d,k:dk(d),s:0,u:new Set()})}const di=Object.fromEntries(days.map((x,i)=>[x.k,i]));
  T.forEach(r=>{const k=dk(r.hour),h=new Date(r.hour);const us=users[r.user_id]=users[r.user_id]||{s:0,days:new Set(),sec:{},last:r.hour};us.s+=r.secs;us.days.add(k);us.sec[r.section]=(us.sec[r.section]||0)+r.secs;if(r.hour>us.last)us.last=r.hour;
    const x=sec[r.section]=sec[r.section]||{s:0,u:new Set()};x.s+=r.secs;x.u.add(r.user_id);if(di[k]!=null){days[di[k]].s+=r.secs;days[di[k]].u.add(r.user_id)}
    heat[(h.getDay()+6)%7][h.getHours()]+=r.secs;const l=(P[r.user_id]||{}).level||"unknown";lvl[l]=(lvl[l]||0)+r.secs});
  A.forEach(r=>{const x=act[r.section]=act[r.section]||{h:0,u:new Set()};x.h+=r.hits;x.u.add(r.user_id)});
  const nU=Object.keys(users).length,ud=Object.values(users).reduce((a,x)=>a+x.days.size,0),ret=Object.values(users).filter(x=>x.days.size>=2).length;
  const today=days[days.length-1],wk=new Set(days.slice(-7).flatMap(x=>[...x.u]));
  const secRows=Object.entries(sec).sort((a,b)=>b[1].s-a[1].s),mxS=Math.max(1,...secRows.map(x=>x[1].s));
  const mxD=Math.max(1,...days.map(x=>x.s)),mxH=Math.max(1,...heat.flat());
  const top=Object.entries(users).sort((a,b)=>b[1].s-a[1].s).slice(0,50);
  const LV={foundation:"Foundation",inter:"Intermediate",final:"Final",unknown:"Not set"};
  main.innerHTML=`<div class="row sp"><div><div class="eyebrow">Usage analytics</div><h1>Where students spend their time</h1></div>
    <div class="row"><div class="seg">${[7,30,90].map(n=>`<button data-an="${n}" aria-pressed="${anRange===n}">${n} days</button>`).join("")}</div><label class="row" style="font-size:.85rem;gap:6px"><input type="checkbox" id="anV" ${anVisitors?"checked":""}> Include visitors</label></div></div>
  <div class="stats">
    <div class="stat"><div class="eyebrow">Study time</div><div class="v">${hrs(total)}</div><div class="s">last ${anRange} days</div></div>
    <div class="stat"><div class="eyebrow">Active students</div><div class="v">${nU}</div><div class="s">${ret} came back on 2+ days</div></div>
    <div class="stat"><div class="eyebrow">Per student per day</div><div class="v">${ud?Math.round(total/ud/60):0} min</div><div class="s">average on days they used it</div></div>
    <div class="stat"><div class="eyebrow">Today</div><div class="v">${hrs(today.s)}</div><div class="s">${today.u.size} student${today.u.size===1?"":"s"}</div></div>
    <div class="stat"><div class="eyebrow">Last 7 days</div><div class="v">${wk.size}</div><div class="s">active students</div></div>
  </div>
  ${total?"":`<div class="card"><p class="muted">No time recorded yet. Time starts counting once analytics-setup.sql has been run and students use the site.</p></div>`}
  <div class="card"><div class="row sp" style="margin-bottom:12px"><h2>Study time per day</h2><span class="muted" style="font-size:.8rem">peak ${hrs(mxD)}</span></div>
    <div class="chart">${days.map(x=>`<div class="col" title="${x.d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}: ${hrs(x.s)} · ${x.u.size} students">${x.s?`<div class="e" style="height:${x.s/mxD*100}%"></div>`:""}</div>`).join("")}</div>
    <div class="xl">${days.map((x,i)=>`<span>${(i%Math.ceil(anRange/6)===0||i===days.length-1)?x.d.getDate()+" "+x.d.toLocaleDateString("en-GB",{month:"short"}):""}</span>`).join("")}</div></div>
  <div class="an-grid">
    <div class="card"><div class="row sp" style="margin-bottom:10px"><h2>Time by section</h2><span class="muted" style="font-size:.8rem">share of study time</span></div>
      ${secRows.length?secRows.map(([k,x])=>`<div class="an-bar" title="${esc(SECN[k]||k)}: ${hrs(x.s)}, ${x.u.size} students"><span class="an-l">${esc(SECN[k]||k)}</span><span class="an-v num">${hrs(x.s)} <span class="muted">· ${Math.round(x.s/Math.max(1,total)*100)}%</span></span><div class="an-t"><i style="width:${x.s/mxS*100}%"></i></div><span class="an-s muted">${x.u.size} student${x.u.size===1?"":"s"} · ${Math.round(x.s/x.u.size/60)} min each</span></div>`).join(""):`<p class="muted">No data yet.</p>`}</div>
    <div class="card"><div class="row sp" style="margin-bottom:10px"><h2>Key actions</h2><span class="muted" style="font-size:.8rem">count · students</span></div>
      <table><tbody>${Object.keys(ACTN).map(k=>{const x=act[k];return `<tr><td>${ACTN[k]}</td><td class="num" style="text-align:right"><b>${x?x.h:0}</b></td><td class="num muted" style="text-align:right">${x?x.u.size:0}</td></tr>`}).join("")}</tbody></table>
      <h2 style="margin:16px 0 8px">Time by level</h2>${Object.entries(lvl).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="an-bar"><span class="an-l">${LV[k]||k}</span><span class="an-v num">${hrs(v)}</span><div class="an-t"><i style="width:${v/Math.max(1,total)*100}%"></i></div></div>`).join("")||`<p class="muted">No data yet.</p>`}</div>
  </div>
  <div class="card"><div class="row sp" style="margin-bottom:10px"><h2>When students study</h2><span class="muted" style="font-size:.8rem">your local time · darker = more time</span></div>
    <div class="an-heat"><span></span>${[...Array(24)].map((_,h)=>`<span class="an-hx">${h%3===0?h:""}</span>`).join("")}${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<span class="an-hy">${d}</span>${heat[i].map((v,h)=>`<i title="${d} ${String(h).padStart(2,"0")}:00 · ${hrs(v)}" style="background:${v?`color-mix(in srgb,var(--heat) ${Math.round(12+v/mxH*88)}%,var(--surface-2))`:"var(--surface-2)"}"></i>`).join("")}`).join("")}</div></div>
  <div class="row sp"><h2>Students by time spent</h2><span class="muted" style="font-size:.8rem">tap a row for their section breakdown</span></div>
  <div class="tbl"><table><thead><tr><th>Student</th><th>Level</th><th style="text-align:right">Time</th><th style="text-align:right">Active days</th><th>Most time on</th><th>Last active</th></tr></thead><tbody>
  ${top.length?top.map(([id,x])=>{const pr=P[id]||{};const fav=Object.entries(x.sec).sort((a,b)=>b[1]-a[1])[0];const open=anOpen===id;
    return `<tr class="an-row" data-au="${id}" style="cursor:pointer"><td>${esc(pr.name)||'<span class="muted">—</span>'}<span class="muted" style="display:block;font-size:.78rem">${esc(pr.email||(pr.is_guest?"Visitor":""))}</span></td><td>${esc(LV[pr.level]||"—")}</td><td class="num" style="text-align:right"><b>${hrs(x.s)}</b></td><td class="num" style="text-align:right">${x.days.size}</td><td>${esc(SECN[fav[0]]||fav[0])}</td><td class="num">${new Date(x.last).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</td></tr>
    ${open?`<tr><td colspan="6" style="white-space:normal;background:var(--surface-2)">${Object.entries(x.sec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="an-bar"><span class="an-l">${esc(SECN[k]||k)}</span><span class="an-v num">${hrs(v)}</span><div class="an-t"><i style="width:${v/x.s*100}%"></i></div></div>`).join("")}</td></tr>`:""}`}).join(""):`<tr><td colspan="6" class="muted">No activity yet.</td></tr>`}
  </tbody></table></div>
  <p class="muted" style="font-size:.8rem">Time counts only while a student is actively using the site (page open and used in the last 2 minutes). Mock exams and videos count for as long as they're open.</p>`;
  document.querySelectorAll("[data-an]").forEach(b=>b.onclick=()=>{anRange=+b.dataset.an;main.innerHTML=`<p class="muted">Loading…</p>`;loadAnalytics()});
  document.getElementById("anV").onchange=e=>{anVisitors=e.target.checked;paintAnalytics()};
  document.querySelectorAll("[data-au]").forEach(r=>r.onclick=()=>{anOpen=anOpen===r.dataset.au?null:r.dataset.au;paintAnalytics()});
}

start();
})();
</script>
</body>
</html>
